<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Ôn Tập Kỹ Thuật An Toàn</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #1e3c72 0%, #0f1a2c 100%);
            min-height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; overflow: hidden; perspective: 1200px;
        }
        .scene-3d { position: relative; width: 100%; height: 320px; display: flex; justify-content: center; align-items: flex-end; margin-bottom: 10px; }
        .boiler {
            position: relative; width: 150px; height: 200px;
            background: linear-gradient(135deg, #444 0%, #999 50%, #222 100%);
            border-radius: 15px 15px 5px 5px;
            box-shadow: inset -15px 0 20px rgba(0,0,0,0.6), inset 15px 0 20px rgba(255,255,255,0.2), 20px 25px 35px rgba(0,0,0,0.7);
            transform: rotateY(-20deg) rotateX(5deg); z-index: 2; animation: floatBoiler 4s ease-in-out infinite;
        }
        .boiler-top {
            position: absolute; top: -25px; left: 0; width: 150px; height: 35px;
            background: linear-gradient(90deg, #333 0%, #888 50%, #333 100%);
            border-radius: 50% / 100% 100% 0 0; box-shadow: 0 -5px 10px rgba(0,0,0,0.5);
        }
        .gauge {
            position: absolute; top: 50px; left: 55px; width: 45px; height: 45px;
            background: #f1c40f; border-radius: 50%; border: 6px solid #222;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6), 0 0 10px rgba(241, 196, 15, 0.5);
        }
        .gauge::after {
            content: ''; position: absolute; top: 20px; left: 20px; width: 3px; height: 18px;
            background: #e74c3c; transform-origin: bottom center; animation: gaugeNeedle 1.5s ease-in-out infinite alternate;
            box-shadow: 0 0 5px #e74c3c;
        }
        .pipe {
            position: absolute; top: 90px; right: -25px; width: 25px; height: 70px;
            background: linear-gradient(90deg, #555, #888); border-radius: 0 8px 8px 0; box-shadow: 8px 0 15px rgba(0,0,0,0.5);
        }
        .steam {
            position: absolute; top: -50px; right: -20px; width: 40px; height: 40px;
            background: rgba(255, 255, 255, 0.7); border-radius: 50%; filter: blur(10px); animation: steamRise 2.5s ease-out infinite;
        }
        .engineer {
            font-size: 120px; position: relative; z-index: 3; margin-left: -40px;
            filter: drop-shadow(10px 20px 15px rgba(0,0,0,0.8)); animation: floatEngineer 3.5s ease-in-out infinite alternate; transform: rotateY(15deg);
        }
        .menu-container {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 40px 50px; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.2);
            text-align: center; transform: translateZ(40px); animation: fadeIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        h1 {
            color: #fff; font-size: 24px; font-weight: 900; margin-bottom: 30px;
            text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 4px 10px rgba(0,0,0,0.8), 0 0 20px rgba(255,255,255,0.2);
        }
        .button-group { display: flex; gap: 25px; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 12px; padding: 18px 35px;
            text-decoration: none; border-radius: 15px; font-size: 18px; font-weight: 700; color: white;
            border: none; cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 0 rgba(0,0,0,0.4), 0 20px 25px rgba(0,0,0,0.3);
            position: relative; top: 0; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn:active { top: 10px; box-shadow: 0 0 0 rgba(0,0,0,0.4), 0 5px 15px rgba(0,0,0,0.3); }
        .btn-exam { background: linear-gradient(135deg, #2ecc71, #27ae60); border-bottom: 4px solid #1e8449; }
        .btn-theory { background: linear-gradient(135deg, #3498db, #2980b9); border-bottom: 4px solid #1a5276; }
        .btn:hover { filter: brightness(1.2); transform: scale(1.05); }
        @keyframes floatBoiler { 0%, 100% { transform: rotateY(-20deg) rotateX(5deg) translateY(0); } 50% { transform: rotateY(-20deg) rotateX(5deg) translateY(-10px); } }
        @keyframes floatEngineer { 0% { transform: rotateY(15deg) translateY(0); } 100% { transform: rotateY(15deg) translateY(-20px); } }
        @keyframes gaugeNeedle { 0% { transform: rotate(-40deg); } 100% { transform: rotate(40deg); } }
        @keyframes steamRise { 0% { transform: translateY(0) scale(1); opacity: 0.8; } 100% { transform: translateY(-80px) scale(2.5); opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px) translateZ(40px) scale(0.9); } to { opacity: 1; transform: translateY(0) translateZ(40px) scale(1); } }
        @media (max-width: 768px) {
            .scene-3d { height: 250px; transform: scale(0.8); }
            .menu-container { padding: 30px 20px; width: 90%; }
            h1 { font-size: 18px; }
            .btn { padding: 15px 20px; font-size: 15px; width: 100%; }
            .button-group { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="scene-3d">
        <div class="boiler">
            <div class="boiler-top"></div>
            <div class="gauge"></div>
            <div class="pipe"></div>
            <div class="steam"></div>
            <div class="steam" style="animation-delay: 1.2s; right: -10px;"></div>
        </div>
        <div class="engineer">👷‍♂️</div>
    </div>
    <div class="menu-container">
        <h1>Hệ Thống Ôn Tập An Toàn</h1>
        <div class="button-group">
            <a href="tracnghiemlo.html" class="btn btn-exam">📝 Thi Trắc Nghiệm</a>
            <a href="lythuyet.html" class="btn btn-theory">📚 Lý Thuyết An Toàn</a>
        </div>
    </div>
</body>
</html>
