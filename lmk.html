{id:271,diff:'Medium',q:'Nội dung nào sau đây là đúng đối với hệ thống nước làm mát kín nhà máy Nhiệt điện Mông Dương 1?',opts:['Phía đầu hút của bơm nước làm mát kín sẽ có van cánh bướm và bộ lọc loại chữ Y với độ đo chênh áp.','Phía đầu đẩy của bơm nước làm mát kín sẽ có van 1 chiều và van cánh bướm dẫn động bằng khí nén.','Bể giãn nở nước làm mát kín có thể tích 31 m³ được đặt trên sàn tuabin, để cân bằng sự dao động lưu lượng của hệ thống và cung cấp đủ nước đầu vào các bơm làm mát kín.','Bể giãn nở nước làm mát kín sẽ được bổ sung từ nước ngưng từ đầu đẩy bơm nước khử khoáng trong quá trình vận hành bình thường.'],ans:1},
{id:272,diff:'Hard',q:'Nội dung nào không phải là phụ tải nước làm mát kín khu vực tuabin Nhà máy nhiệt điện Mông Dương?',opts:['Các bộ làm mát dầu bôi trơn tuabin máy phát;\nCác bộ làm mát dầu điều chỉnh tuabin;\nCác bộ làm mát hydro máy phát;\nCác bộ làm mát nước làm mát cuộn dây stato máy phát.','Các bộ làm mát bơm tái tuần hoàn bình khử khí;\nNước làm mát kín của hệ thống mồi chân không hộp nước tuần hoàn bình ngưng;\nCác bộ làm mát gối trục hệ thống bơm ngưng;\nCác bộ làm mát dầu bôi trơn, dầu khớp nối thủy lực bơm nước cấp;\nCác bộ làm mát dầu điều chỉnh tốc độ làm việc của khớp nối thủy lực bơm nước cấp.','Các bộ làm mát bơm tái tuần hoàn bình khử khí;\nCác bộ làm mát của hệ thống chân không bình ngưng;\nCác bộ làm mát gối trục hệ thống bơm ngưng;\nCác bộ làm mát dầu bôi trơn, dầu khớp nối thủy lực bơm nước cấp;\nCác bộ làm mát dầu điều chỉnh tốc độ làm việc của khớp nối thủy lực bơm nước cấp.','Các bộ làm mát động cơ bơm nước cấp;\nCác bộ làm mát tết chèn cơ khí bơm nước cấp;\nCác bộ làm mát tết chèn cơ khí bơm tăng áp nước cấp;\nCác bộ làm mát máy nén khí;\nBộ làm mát lấy mẫu.'],ans:3},
{id:273,diff:'Medium',q:'Nội dung nào không phải là phụ tải nước làm mát kín khu vực lò hơi Nhà máy nhiệt điện Mông Dương?',opts:['Các bộ làm mát dầu gối trục bộ sấy không khí lò hơi;\nCác bộ làm mát dầu gối trục quạt gió sơ cấp lò hơi;\nCác bộ làm mát dầu gối trục quạt gió thứ cấp lò hơi.','Các bộ làm mát dầu gối trục quạt tải đá vôi lò hơi;\nCác bộ làm mát dầu quạt khói;\nCác bộ làm mát dầu đốt lò.','Các bộ làm mát hệ thống xử lý tro xỉ;\nCác bộ làm mát hệ thống xử lý đá vôi.','Các bộ làm mát hệ thống lò hơi phụ;\nCác bộ làm mát bơm xả bộ sấy không khí kiểu bằng hơi (sơ bộ);\nBộ làm mát khớp nối biến tần quạt khói.'],ans:4},

{id:278,diff:'Easy',q:'Giá trị bảo vệ nhiệt độ gối trục động cơ bơm làm mát kín (cả hai gối):',opts:['105°C','100°C','110°C','115°C'],ans:1},
{id:279,diff:'Easy',q:'Giá trị bảo vệ nhiệt độ gối trục bơm làm mát kín (cả hai gối):',opts:['90°C','95°C','100°C','105°C'],ans:2},

{id:281,diff:'Hard',q:'Nội dung nào sau đây là không đúng đối với hệ thống nước làm mát kín nhà máy Nhiệt điện Mông Dương 1?',opts:['Trên bể dãn nở nước làm mát kín bố trí một thiết bị đo mức tại chỗ và một thiết bị đo mức gửi về DCS. Thiết bị đo mức gửi về DCS dùng để làm cơ sở tính nước bổ sung vào bể dãn nở theo logic cơ bản.','Để hạn chế sự ăn mòn, đóng gỉ và cáu cặn trên thiết bị, đường ống nước làm mát kín, hệ thống được bố trí điểm cấp hóa chất trên đường tuần hoàn từ đầu đẩy về đầu hút bơm để nâng độ pH của nước lên khoảng 6.5.','Nước làm mát kín (nước khử khoáng) sẽ được tuần hoàn thông qua bộ làm mát nước làm mát kín bởi 2 x 100% bơm nước làm mát kín cho mỗi tổ máy. Nước làm mát kín sẽ được đưa tới các thiết bị để làm mát đảm bảo thiết bị làm việc an toàn.','Nước làm mát kín (nước khử khoáng) sẽ được tuần hoàn thông qua bộ làm mát nước làm mát kín bởi 3 x 100% bơm nước làm mát kín cho mỗi tổ máy. Nước làm mát kín sẽ được đưa tới các thiết bị để làm mát đảm bảo thiết bị làm việc an toàn.'],ans:2},
{id:282,diff:'Easy',q:'Giá trị liên động bơm dự phòng làm việc khi áp lực đầu đẩy bơm làm mát kín xuống dưới?',opts:['5 bar','4.6 bar','4 bar','4.5 bar'],ans:2},
{id:283,diff:'Hard',q:'Trình tự khởi động hệ thống nước làm mát kín sau đây là đúng:',opts:['Bước 1: Đảm bảo mức nước trong bể, van đầu hút bơm mở, bơm đã được điền đầy và đuổi khí thành công.\nBước 2: Đóng van đầu đẩy bơm khởi động và đưa về chế độ AUTO (van đầu đẩy của bơm bên cạnh đóng).\nBước 3: Khởi động bơm tại DCS.\nBước 4: Kích Start bơm cần khởi động: kiểm tra tình trạng làm việc của bơm, kiểm tra van đầu đẩy bơm có liên động mở tốt không; thông số công suất, dòng điện bơm, áp lực đầu đẩy bơm...; dưới công trường kiểm tra tình trạng làm việc của bơm, tình trạng van đầu đẩy, chiều quay, tiếng kêu, rung động của bơm…\nBước 5: Xác nhận bơm đã được khởi động thành công.','Bước 1: Đảm bảo mức nước trong bể, van đầu hút bơm mở, bơm đã được điền đầy và đuổi khí thành công.\nBước 2: Đóng van đầu đẩy bơm khởi động và đưa về chế độ MAN (van đầu đẩy của bơm bên cạnh đóng).\nBước 3: Khởi động bơm tại DCS.\nBước 4: Kích Start bơm cần khởi động: kiểm tra tình trạng làm việc của bơm, kiểm tra van đầu đẩy bơm có liên động mở tốt không; thông số công suất, dòng điện bơm, áp lực đầu đẩy bơm...; dưới công trường mở van đầu đẩy, kiểm tra tình trạng làm việc của bơm, chiều quay, tiếng kêu, rung động của bơm…\nBước 5: Xác nhận bơm đã được khởi động thành công.','Bước 1: Đảm bảo mức nước trong bể, van đầu hút bơm mở, bơm đã được điền đầy và đuổi khí thành công.\nBước 2: Đóng van đầu đẩy bơm khởi động và đưa về chế độ AUTO (van đầu đẩy của bơm bên cạnh đóng).\nBước 3: Khởi động bơm tại tại chỗ.\nBước 4: Kích Start bơm cần khởi động: kiểm tra tình trạng làm việc của bơm, kiểm tra van đầu đẩy bơm có liên động mở tốt không; thông số công suất, dòng điện bơm, áp lực đầu đẩy bơm...; dưới công trường kiểm tra tình trạng làm việc của bơm, tình trạng van đầu đẩy, chiều quay, tiếng kêu, rung động của bơm…\nBước 5: Xác nhận bơm đã được khởi động thành công.','Bước 1: Đảm bảo mức nước trong bể, van đầu hút bơm mở, bơm đã được điền đầy và đuổi khí thành công.\nBước 2: Đóng van đầu đẩy bơm khởi động và đưa về chế độ AUTO (van đầu đẩy của bơm bên cạnh mở).\nBước 3: Khởi động bơm tại DCS.\nBước 4: Kích Start bơm cần khởi động: kiểm tra tình trạng làm việc của bơm, kiểm tra van đầu đẩy bơm có liên động mở tốt không; thông số công suất, dòng điện bơm, áp lực đầu đẩy bơm...; dưới công trường kiểm tra tình trạng làm việc của bơm, tình trạng van đầu đẩy, chiều quay, tiếng kêu, rung động của bơm…\nBước 5: Xác nhận bơm đã được khởi động thành công.'],ans:1},

const letters = ['A','B','C','D'];
const container = document.getElementById('quizContainer');
const submitBtn = document.getElementById('submitBtn');
const resetBtn = document.getElementById('resetBtn');
const scoreBox = document.getElementById('scoreBox');
const scoreNumber = document.getElementById('scoreNumber');
const scoreLabel = document.getElementById('scoreLabel');
const answeredCount = document.getElementById('answeredCount');
const statusText = document.getElementById('statusText');

let submitted = false;
const userAnswers = {};
const lockedQuestions = new Set();

document.getElementById('totalCount').textContent = questions.length;
scoreNumber.textContent = '0 / ' + questions.length;

/* ==================== RENDER ==================== */
function renderQuiz() {
  container.innerHTML = '';
  questions.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'q-' + q.id;
    let optionsHtml = '';
    q.opts.forEach((opt, i) => {
      optionsHtml += `
        <label class="option" data-qid="${q.id}" data-opt="${i+1}">
          <input type="radio" name="q${q.id}" value="${i+1}">
          <span class="option-letter">${letters[i]}.</span>
          <span class="option-text">${opt}</span>
        </label>`;
    });
    card.innerHTML = `
      <div class="q-header">
        <span class="q-num">Câu ${idx+1}</span>
        <span class="q-diff diff-${q.diff}">${q.diff}</span>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="options">${optionsHtml}</div>
      <div class="feedback" id="fb-${q.id}"></div>`;
    container.appendChild(card);
  });
  attachHandlers();
}

/* ==================== HANDLERS ==================== */
function attachHandlers() {
  container.querySelectorAll('input[type="radio"]').forEach(input => {
    input.addEventListener('change', e => {
      const qid = parseInt(e.target.name.replace('q',''));
      if (submitted || lockedQuestions.has(qid)) return;
      userAnswers[qid] = parseInt(e.target.value);
      lockAndReveal(qid);
      updateProgress();
    });
  });
}

/* ==================== LOCK & REVEAL ==================== */
function lockAndReveal(qid) {
  const q = questions.find(x => x.id === qid);
  const card = document.getElementById('q-' + qid);
  const fb = document.getElementById('fb-' + qid);
  lockedQuestions.add(qid);
  card.querySelectorAll('input').forEach(inp => inp.disabled = true);
  card.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));

  const userAns = userAnswers[qid];
  const isCorrect = userAns === q.ans;

  card.querySelectorAll('.option').forEach(o => {
    const v = parseInt(o.dataset.opt);
    if (v === q.ans) o.classList.add('correct-answer');
    if (v === userAns && v !== q.ans) o.classList.add('wrong-answer');
  });

  if (isCorrect) {
    card.classList.add('correct');
    fb.className = 'feedback show ok';
    fb.textContent = `✓ Chính xác! Đáp án đúng là ${letters[q.ans-1]}.`;
  } else {
    card.classList.add('incorrect');
    fb.className = 'feedback show no';
    fb.textContent = `✗ Sai. Bạn chọn ${letters[userAns-1]}, đáp án đúng là ${letters[q.ans-1]}.`;
  }
}

/* ==================== PROGRESS ==================== */
function updateProgress() {
  answeredCount.textContent = lockedQuestions.size;
  if (!submitted) {
    statusText.textContent = lockedQuestions.size === questions.length
      ? '🎉 Đã hoàn thành tất cả câu hỏi!'
      : `Còn ${questions.length - lockedQuestions.size} câu chưa làm`;
  }
}

/* ==================== SUBMIT ==================== */
function submitQuiz() {
  if (submitted) return;
  submitted = true;
  let correctCount = 0;
  questions.forEach(q => {
    if (lockedQuestions.has(q.id) && userAnswers[q.id] === q.ans) correctCount++;
  });
  const pct = Math.round((correctCount / questions.length) * 100);
  let grade = '';
  if (pct >= 90) grade = 'Xuất sắc! 🎉';
  else if (pct >= 75) grade = 'Tốt! 👍';
  else if (pct >= 50) grade = 'Trung bình — cần ôn thêm.';
  else grade = 'Cần ôn luyện thêm.';
  scoreBox.classList.add('show');
  scoreNumber.textContent = `${correctCount} / ${questions.length}`;
  scoreLabel.textContent = `Đúng ${pct}% — ${grade} (đã làm ${lockedQuestions.size}/${questions.length} câu)`;
  statusText.textContent = 'Đã tổng kết';
  scoreBox.scrollIntoView({behavior:'smooth', block:'start'});
}

/* ==================== RESET ==================== */
function resetQuiz() {
  if (!confirm('Bạn có chắc muốn làm lại từ đầu? Tất cả câu trả lời sẽ bị xóa.')) return;
  submitted = false;
  Object.keys(userAnswers).forEach(k => delete userAnswers[k]);
  lockedQuestions.clear();
  scoreBox.classList.remove('show');
  renderQuiz();
  answeredCount.textContent = '0';
  statusText.textContent = 'Đang làm bài...';
  window.scrollTo({top:0, behavior:'smooth'});
}

submitBtn.addEventListener('click', submitQuiz);
resetBtn.addEventListener('click', resetQuiz);
renderQuiz();
</script>
