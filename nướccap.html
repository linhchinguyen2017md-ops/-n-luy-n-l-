const questions = [
{id:239,diff:'Easy',q:'Nhiệm vụ của hệ thống nước cấp:',opts:['Hệ thống nước cấp nhận nước ngưng được gia nhiệt từ bình khử khí. Các bơm cấp vận chuyển nước cấp đi qua các bình gia nhiệt hạ áp để gia nhiệt cho nước cấp nhằm nâng cao hiệu suất chu trình nhiệt, sau đó được rẽ thành hai đường đưa sang 2 lò; qua cụm các cụm van điều chỉnh, bộ hâm và vào hai bao hơi.','Hệ thống nước cấp nhận nước ngưng được gia nhiệt từ bình khử khí. Các bơm cấp vận chuyển nước cấp đi qua các bình gia nhiệt cao áp để gia nhiệt cho nước cấp nhằm nâng cao hiệu suất chu trình nhiệt, sau đó được rẽ thành hai đường đưa sang 2 lò; qua cụm các cụm van điều chỉnh, bộ hâm và vào hai bao hơi.','Hệ thống nước cấp nhận nước ngưng được gia nhiệt từ bình gia nhiệt hạ áp; Các bơm cấp vận chuyển nước cấp đi qua các bình gia nhiệt cao áp để gia nhiệt cho nước cấp nhằm nâng cao hiệu suất chu trình nhiệt, sau đó được rẽ thành hai đường đưa sang 2 lò; qua cụm các cụm van điều chỉnh, bộ hâm và vào hai bao hơi.','Hệ thống nước cấp nhận nước ngưng được gia nhiệt từ bình khử khí. Các bơm cấp vận chuyển nước cấp đi qua các bình gia nhiệt cao áp để gia nhiệt cho nước cấp nhằm nâng cao hiệu suất chu trình nhiệt, sau đó được đưa sang lần lượt từng lò; qua cụm các cụm van điều chỉnh, bộ hâm và vào hai bao hơi.'],ans:2},
{id:240,diff:'Easy',q:'Nội dung nào sau đây là đúng đối với hệ thống nước cấp nhà máy Nhiệt điện Mông Dương 1?',opts:['Khi tổ máy làm việc bình thường thì phương thức vận hành là: 1 bơm làm việc, 1 bơm dự phòng liên động. Mỗi bơm sẽ đáp ứng 100% công suất cộng với độ dự phòng.','Khi tổ máy làm việc bình thường thì phương thức vận hành là: 2 bơm làm việc, 1 bơm dự phòng liên động. Mỗi bơm sẽ đáp ứng 75% công suất cộng với độ dự phòng.','Khi tổ máy làm việc bình thường thì phương thức vận hành là: 2 bơm làm việc, 1 bơm dự phòng liên động. Mỗi bơm sẽ đáp ứng 50% công suất cộng với độ dự phòng.','Khi tổ máy làm việc bình thường thì phương thức vận hành là: 2 bơm làm việc, 1 bơm dự phòng liên động. Mỗi bơm sẽ đáp ứng 65% công suất cộng với độ dự phòng.'],ans:3},
{id:241,diff:'Easy',q:'Nội dung nào sau đây là đúng đối với hệ thống nước cấp nhà máy Nhiệt điện Mông Dương 1?',opts:['Đầu hút bơm tăng áp được đấu vào bể dự trữ nước khử khoáng, đầu đẩy của bơm tăng áp được đấu vào đầu hút của bơm cấp chính. Bơm tăng áp được nối cứng với động cơ, còn bơm cấp chính được dẫn động bằng động cơ thông qua bộ bánh răng tăng tốc và khớp nối thủy lực có khả năng thay đổi tốc độ.','Đầu hút bơm tăng áp được đấu vào đầu ra của BGN hạ áp 4, đầu đẩy của bơm tăng áp được đấu vào đầu hút của bơm cấp chính. Bơm tăng áp được nối cứng với động cơ, còn bơm cấp chính được dẫn động bằng động cơ thông qua bộ bánh răng tăng tốc và khớp nối thủy lực có khả năng thay đổi tốc độ.','Đầu hút bơm tăng áp được đấu vào bể dự trữ nước khử khí, đầu đẩy của bơm tăng áp được đấu vào đầu hút của bơm cấp chính. Bơm cấp được nối cứng với động cơ, còn bơm tăng áp được dẫn động bằng động cơ thông qua bộ bánh răng tăng tốc và khớp nối thủy lực có khả năng thay đổi tốc độ.','Đầu hút bơm tăng áp được đấu vào bể dự trữ nước khử khí, đầu đẩy của bơm tăng áp được đấu vào đầu hút của bơm cấp chính. Bơm tăng áp được nối cứng với động cơ, còn bơm cấp chính được dẫn động bằng động cơ thông qua bộ bánh răng tăng tốc và khớp nối thủy lực có khả năng thay đổi tốc độ.'],ans:4},
{id:242,diff:'Easy',q:'Nội dung nào sau đây là đúng đối với hệ thống nước cấp nhà máy Nhiệt điện Mông Dương 1?',opts:['Tại tầng cánh trung gian của mỗi bơm cấp có trích một đường lấy nước cho phun giảm ôn bypass HP và bộ tái nhiệt của mỗi lò hơi.','Tại tầng cánh trung gian của mỗi bơm cấp có trích một đường lấy nước cho phun giảm ôn bypass LP và bộ tái nhiệt của mỗi lò hơi.','Tại tầng cánh trung gian của mỗi bơm cấp có trích một đường lấy nước cho phun giảm ôn bypass HP và bộ quá nhiệt của mỗi lò hơi.','Tại tầng cánh đầu tiên của mỗi bơm cấp có trích một đường lấy nước cho phun giảm ôn bypass HP và bộ tái nhiệt của mỗi lò hơi.'],ans:1},
{id:243,diff:'Easy',q:'Nội dung nào sau đây là đúng đối với hệ thống nước cấp nhà máy Nhiệt điện Mông Dương 1?',opts:['Bình khử khí dùng để loại bỏ khí ôxi và các khí không ngưng khác trong nước cấp. Phương pháp khử khí là dùng khí để gia nhiệt trực tiếp cho nước cấp, nhờ đó nước cấp được gia nhiệt tới nhiệt độ bão hoà tương ứng với áp suất vận hành trong bình khử khí.','Bình khử khí dùng để loại bỏ khí ôxi và các khí không ngưng khác trong nước cấp. Phương pháp khử khí là dùng hơi để gia nhiệt trực tiếp cho nước cấp, nhờ đó nước cấp được gia nhiệt tới nhiệt độ bão hoà tương ứng với áp suất vận hành trong bình khử khí.','Bình khử khí dùng để loại bỏ khí oxi và các khí không ngưng khác trong nước cấp. Phương pháp khử khí là dùng hơi để gia nhiệt gián tiếp cho nước cấp, nhờ đó nước cấp được gia nhiệt tới nhiệt độ bão hoà tương ứng với áp suất vận hành trong bình khử khí.','Bình khử khí dùng để loại bỏ khí ôxi và các khí không ngưng khác trong nước cấp. Phương pháp khử khí là dùng hơi cấp vào bể chứa nước cấp để gia nhiệt trực tiếp cho nước cấp, nhờ đó nước cấp được gia nhiệt tới nhiệt độ tương ứng với áp suất vận hành trong bình khử khí.'],ans:2},
{id:244,diff:'Easy',q:'Bơm tăng áp bơm cấp là bơm?',opts:['Bơm tăng áp là bơm ly tâm 1 tầng cánh, thân kiểu nằm ngang, tầng cánh đơn, một đầu hút. Bơm được nối cứng với động cơ; bơm được chèn tại đầu dẫn động và đầu không dẫn động bởi các bộ chèn cơ khí.','Bơm tăng áp là bơm ly tâm 1 tầng cánh, thân kiểu nằm ngang, tầng cánh kép, một đầu hút. Bơm được nối cứng với động cơ; bơm được chèn tại đầu dẫn động và đầu không dẫn động bởi các bộ chèn cơ khí.','Bơm tăng áp là bơm ly tâm 1 tầng cánh, thân kiểu nằm dọc, tầng cánh đơn, một đầu hút. Bơm được nối cứng với động cơ; bơm được chèn tại đầu dẫn động và đầu không dẫn động bởi các tết chèn.','Bơm tăng áp là trục vít tâm 1 tầng cánh, thân kiểu nằm ngang, tầng cánh kép, một đầu hút. Bơm được nối cứng với động cơ; bơm được chèn tại đầu dẫn động và đầu không dẫn động bởi các bộ chèn cơ khí.'],ans:1},
{id:245,diff:'Medium',q:'Bơm nước cấp chính là bơm:',opts:['Bơm nước cấp chính là bơm ly tâm 5 tầng cánh. Bơm được dẫn động bằng động cơ thông qua khớp nối thủy lực, có thể thay đổi được tốc độ. Bơm được chèn tại đầu dẫn động và không dẫn động bằng tết chèn chịu áp lực, nhiệt độ cao.','Bơm nước cấp chính là bơm ly tâm 4 tầng cánh. Bơm được dẫn động bằng động cơ thông qua khớp nối cứng, có thể thay đổi được tốc độ. Bơm được chèn tại đầu dẫn động và không dẫn động bằng tết chèn chịu áp lực, nhiệt độ cao.','Bơm nước cấp chính là bơm ly tâm 4 tầng cánh. Bơm được dẫn động bằng động cơ thông qua khớp nối thủy lực, có thể thay đổi được tốc độ. Bơm được chèn tại đầu dẫn động và không dẫn động bằng bộ chèn cơ khí.','Bơm nước cấp chính là trục vít có 4 tầng cánh. Bơm được dẫn động bằng động cơ thông qua khớp nối thủy lực, có thể thay đổi được tốc độ. Bơm được chèn tại đầu dẫn động và không dẫn động bằng bộ chèn cơ khí.'],ans:3},

const letters = ['A','B','C','D'];
const container = document.getElementById('quizContainer');
const submitBtn = document.getElementById('submitBtn');
const resetBtn = document.getElementById('resetBtn');
const scoreBox = document.getElementById('scoreBox');
const scoreNumber = document.getElementById('scoreNumber');
const scoreLabel = document.getElementById('scoreLabel');
const answeredCount = document.getElementById('answeredCount');
const statusText = document.getElementById('statusText');

let submitted = false;
const userAnswers = {};
const lockedQuestions = new Set();

document.getElementById('totalCount').textContent = questions.length;
scoreNumber.textContent = '0 / ' + questions.length;

/* ==================== RENDER ==================== */
function renderQuiz() {
  container.innerHTML = '';
  questions.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'q-' + q.id;
    let optionsHtml = '';
    q.opts.forEach((opt, i) => {
      optionsHtml += `
        <label class="option" data-qid="${q.id}" data-opt="${i+1}">
          <input type="radio" name="q${q.id}" value="${i+1}">
          <span class="option-letter">${letters[i]}.</span>
          <span class="option-text">${opt}</span>
        </label>`;
    });
    card.innerHTML = `
      <div class="q-header">
        <span class="q-num">Câu ${idx+1}</span>
        <span class="q-diff diff-${q.diff}">${q.diff}</span>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="options">${optionsHtml}</div>
      <div class="feedback" id="fb-${q.id}"></div>`;
    container.appendChild(card);
  });
  attachHandlers();
}

/* ==================== HANDLERS ==================== */
function attachHandlers() {
  container.querySelectorAll('input[type="radio"]').forEach(input => {
    input.addEventListener('change', e => {
      const qid = parseInt(e.target.name.replace('q',''));
      if (submitted || lockedQuestions.has(qid)) return;
      userAnswers[qid] = parseInt(e.target.value);
      lockAndReveal(qid);
      updateProgress();
    });
  });
}

/* ==================== LOCK & REVEAL ==================== */
function lockAndReveal(qid) {
  const q = questions.find(x => x.id === qid);
  const card = document.getElementById('q-' + qid);
  const fb = document.getElementById('fb-' + qid);
  lockedQuestions.add(qid);
  card.querySelectorAll('input').forEach(inp => inp.disabled = true);
  card.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));

  const userAns = userAnswers[qid];
  const isCorrect = userAns === q.ans;

  card.querySelectorAll('.option').forEach(o => {
    const v = parseInt(o.dataset.opt);
    if (v === q.ans) o.classList.add('correct-answer');
    if (v === userAns && v !== q.ans) o.classList.add('wrong-answer');
  });

  if (isCorrect) {
    card.classList.add('correct');
    fb.className = 'feedback show ok';
    fb.textContent = `✓ Chính xác! Đáp án đúng là ${letters[q.ans-1]}.`;
  } else {
    card.classList.add('incorrect');
    fb.className = 'feedback show no';
    fb.textContent = `✗ Sai. Bạn chọn ${letters[userAns-1]}, đáp án đúng là ${letters[q.ans-1]}.`;
  }
}

/* ==================== PROGRESS ==================== */
function updateProgress() {
  answeredCount.textContent = lockedQuestions.size;
  if (!submitted) {
    statusText.textContent = lockedQuestions.size === questions.length
      ? '🎉 Đã hoàn thành tất cả câu hỏi!'
      : `Còn ${questions.length - lockedQuestions.size} câu chưa làm`;
  }
}

/* ==================== SUBMIT ==================== */
function submitQuiz() {
  if (submitted) return;
  submitted = true;
  let correctCount = 0;
  questions.forEach(q => {
    if (lockedQuestions.has(q.id) && userAnswers[q.id] === q.ans) correctCount++;
  });
  const pct = Math.round((correctCount / questions.length) * 100);
  let grade = '';
  if (pct >= 90) grade = 'Xuất sắc! 🎉';
  else if (pct >= 75) grade = 'Tốt! 👍';
  else if (pct >= 50) grade = 'Trung bình — cần ôn thêm.';
  else grade = 'Cần ôn luyện thêm.';
  scoreBox.classList.add('show');
  scoreNumber.textContent = `${correctCount} / ${questions.length}`;
  scoreLabel.textContent = `Đúng ${pct}% — ${grade} (đã làm ${lockedQuestions.size}/${questions.length} câu)`;
  statusText.textContent = 'Đã tổng kết';
  scoreBox.scrollIntoView({behavior:'smooth', block:'start'});
}

/* ==================== RESET ==================== */
function resetQuiz() {
  if (!confirm('Bạn có chắc muốn làm lại từ đầu? Tất cả câu trả lời sẽ bị xóa.')) return;
  submitted = false;
  Object.keys(userAnswers).forEach(k => delete userAnswers[k]);
  lockedQuestions.clear();
  scoreBox.classList.remove('show');
  renderQuiz();
  answeredCount.textContent = '0';
  statusText.textContent = 'Đang làm bài...';
  window.scrollTo({top:0, behavior:'smooth'});
}

submitBtn.addEventListener('click', submitQuiz);
resetBtn.addEventListener('click', resetQuiz);
renderQuiz();
</script>
