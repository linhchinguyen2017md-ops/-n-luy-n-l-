<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài trắc nghiệm: Tuabin – Lý thuyết chuyên ngành</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
    --primary:#2563eb; --primary-dark:#1d4ed8; --border:#e5e7eb;
    --correct:#16a34a; --correct-bg:#ecfdf5; --wrong:#dc2626; --wrong-bg:#fef2f2;
    --partial:#d97706; --partial-bg:#fffbeb;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:24px 12px; background:var(--bg); color:var(--text);
    font-family:"Segoe UI", Roboto, Arial, sans-serif; line-height:1.55;
  }
  .wrap{max-width:900px; margin:0 auto;}
  header{
    background:linear-gradient(135deg,#1e3a8a,#2563eb);
    color:#fff; padding:24px 28px; border-radius:14px; margin-bottom:20px;
    box-shadow:0 6px 20px rgba(37,99,235,.25);
  }
  header h1{margin:0 0 6px; font-size:1.5rem;}
  header p{margin:0; opacity:.9; font-size:.95rem;}
  .toolbar{
    position:sticky; top:0; z-index:10; background:var(--bg);
    padding:12px 0; display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  }
  .toolbar .progress{margin-left:auto; font-size:.9rem; color:var(--muted);}
  button{
    font:inherit; cursor:pointer; border:none; border-radius:10px;
    padding:10px 18px; font-weight:600; transition:.18s;
  }
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{background:#fff; color:var(--text); border:1px solid var(--border);}
  .btn-ghost:hover{background:#f3f4f6;}
  .q{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:18px 20px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .q .num{
    display:inline-block; background:#eef2ff; color:var(--primary-dark);
    font-weight:700; font-size:.8rem; padding:2px 10px; border-radius:999px;
    margin-bottom:10px;
  }
  .q .num.multi{background:#fef3c7; color:#b45309}
  .q .num.multi::after{content:" · nhiều đáp án";}
  .q .stem{font-weight:600; margin-bottom:12px;}
  .opt{
    display:flex; gap:10px; align-items:flex-start; padding:10px 12px;
    border:1px solid var(--border); border-radius:10px; margin-bottom:8px;
    cursor:pointer; transition:.15s; background:#fff;
  }
  .opt:hover{background:#f9fafb; border-color:#c7d2fe;}
  .opt input{margin-top:4px; accent-color:var(--primary); cursor:pointer;}
  .opt .label{font-weight:700; color:var(--primary-dark); min-width:18px;}
  .opt.sel{border-color:var(--primary); background:#eff6ff;}
  .opt.correct{border-color:var(--correct); background:var(--correct-bg);}
  .opt.wrong{border-color:var(--wrong); background:var(--wrong-bg);}
  .opt.missed{border-color:var(--partial); background:var(--partial-bg);}
  .opt.correct .label{color:var(--correct);}
  .opt.wrong .label{color:var(--wrong);}
  .opt.missed .label{color:var(--partial);}
  .explain{
    display:none; margin-top:10px; padding:12px 14px; border-radius:10px;
    background:#f8fafc; border-left:4px solid var(--primary); font-size:.93rem;
  }
  .explain.show{display:block;}
  .explain .tag{font-weight:700; color:var(--correct);}
  .explain .tag.partial{color:var(--partial);}
  .explain .tag.wrong{color:var(--wrong);}
  .q.result-correct{border-color:var(--correct);}
  .q.result-wrong{border-color:var(--wrong);}
  .q.result-partial{border-color:var(--partial);}
  .summary{
    display:none; background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:22px; margin-top:18px; text-align:center;
  }
  .summary.show{display:block;}
  .summary .score{font-size:2.6rem; font-weight:800; color:var(--primary);}
  .summary .detail{color:var(--muted); margin-top:4px;}
  .summary .msg{margin-top:12px; font-weight:600;}
  @media (max-width:520px){
    header{padding:18px;}
    header h1{font-size:1.2rem;}
    .toolbar .progress{width:100%; margin-left:0;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bài trắc nghiệm: Tuabin – Lý thuyết chuyên ngành</h1>
    <p>50 câu hỏi – Đáp án và giải thích hiện ngay khi bạn chọn. Dựa theo file Excel gốc (bản cuối).</p>
  </header>
  <div class="toolbar">
    <button class="btn-primary" onclick="checkAll()">Kiểm tra tổng kết</button>
    <button class="btn-ghost" onclick="resetAll()">Làm lại</button>
    <span class="progress" id="progress">Đã trả lời: 0/50</span>
  </div>
  <form id="quiz"></form>
  <div class="summary" id="summary">
    <div class="score" id="score">0/50</div>
    <div class="detail" id="detail"></div>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script>
/* ====== DỮ LIỆU CÂU HỎI – Đã đối chiếu & chỉnh theo Excel gốc ======
   ans: mảng chỉ số (0-based) đáp án đúng theo thứ tự option trong Excel.
   result trong Excel là 1-based → ans = [result-1] */
const QUESTIONS = [
  {q:"Để nâng công suất cho một tổ máy lò hơi – tuabin và gia tăng hiệu suất chu trình nhiệt, các nhà máy nhiệt điện thường:",
   opts:["Sử dụng thông số hơi cận và trên tới hạn kết hợp với tái nhiệt trung gian, nhiệt độ hơi mới và hơi tái nhiệt thường bằng và trên 540°C.",
         "Sử dụng tuabin ngưng hơi, áp suất không quá 170 bar, nhiệt độ không quá 545°C và không sử dụng quá nhiệt trung gian (tái nhiệt trung gian).",
         "Sử dụng tuabin một thân có đối áp hơi thoát và thông số áp suất hơi mới nhỏ hơn 100 bar, nhiệt độ hơi mới dưới 538°C."],
   ans:[2], ex:"Theo file Excel gốc, đáp án là phương án 3 (tuabin một thân đối áp, thông số thấp). Lưu ý: về mặt kỹ thuật, phương án dùng thông số cận/trên tới hạn + tái nhiệt mới là giải pháp phổ biến để nâng công suất & hiệu suất."},
  {q:"Xu hướng để gia tăng hiệu suất và hiệu quả kinh tế của chu trình nhà máy nhiệt điện hiện nay là:",
   opts:["Áp dụng chu trình kết hợp khí – hơi, áp dụng tối đa việc trích hơi từ tuabin để gia nhiệt và hồi nhiệt nước cấp.",
         "Tăng áp suất hơi mới, tăng nhiệt độ hơi mới, áp dụng quá nhiệt trung gian, hạ thấp chân không bình ngưng.",
         "Áp dụng đồng thời các giải pháp nói trên."],
   ans:[2], ex:"Kết hợp đồng thời nhiều giải pháp mới đạt hiệu quả kinh tế – kỹ thuật tối ưu."},
  {q:"Để có công suất đơn vị lớn, hiệu suất cao, tuabin hơi nước được thiết kế với một số đặc điểm chính:",
   opts:["Tăng cao thông số áp suất hơi mới và sử dụng các tuabin một tầng hoặc tuabin có ít số tầng cánh.",
         "Tăng cao thông số hơi mới (gồm nhiệt độ to, áp suất po), áp dụng tái nhiệt và sử dụng tuabin nhiều tầng ghép nối tiếp với nhau, áp dụng triệt để trích hơi, gia nhiệt, hồi nhiệt nước cấp.",
         "Sử dụng các tuabin ngưng hơi thuần túy, không có gia nhiệt hồi nhiệt nước cấp, với lò hơi có thông số cao áp."],
   ans:[1], ex:"Tăng thông số hơi mới + tái nhiệt + nhiều tầng + trích hơi hồi nhiệt là đặc điểm tuabin công suất lớn."},
  {q:"Một vài nguyên nhân chính thường dẫn đến sự suy giảm hiệu suất tương đối của tuabin hơi trong quá trình vận hành là:",
   opts:["Chất lượng hơi nước không đảm bảo, gây hiện tượng cáu bám trên phần truyền dòng, dẫn đến làm tăng ma sát trong các dãy cánh.",
         "Các thông số vận hành như nhiệt độ - áp suất hơi mới thường thấp hơn định mức, áp suất tuyệt đối trong bình ngưng cao hơn chế độ thiết kế.",
         "Cả hai nguyên nhân kể trên."],
   ans:[2], ex:"Cả cáu bám và thông số vận hành lệch định mức đều làm giảm hiệu suất tương đối."},
  {q:"Trong các tuabin hơi nước hiện đại, hiệu suất trong tương đối lớn nhất sẽ thuộc phần thân:",
   opts:["Cao áp.","Trung áp.","Hạ áp."],
   ans:[1], ex:"Phần trung áp thường có hiệu suất trong tương đối lớn nhất."},
  {q:"Tầng cánh điều chỉnh của tuabin hơi thường có đặc điểm đặc trưng như sau:",
   opts:["Là tầng cánh có độ phản lực thấp nhất, nhiệt giáng cao nhất, làm việc trong vùng nhiệt độ và áp suất cao nhất.",
         "Tầng cánh có đường kính trung bình, không chịu ảnh hưởng lớn của độ ẩm, không làm việc trong vùng áp suất cao, nhưng chịu ảnh hưởng lớn nhất bởi nhiệt độ từ lò hơi đưa sang.",
         "Tầng cánh có đường kính đỉnh cánh lớn nhất, chiều dài cánh lớn nhất, chịu sự chênh áp suất hai bên dãy cánh lớn nhất, và thường nằm trong vùng hơi bão hòa ẩm."],
   ans:[0], ex:"Tầng điều chỉnh: độ phản lực thấp nhất, nhiệt giáng cao nhất, làm việc vùng nhiệt độ/áp suất cao nhất."},
  {q:"Trong quá trình điều chỉnh lưu lượng hơi mới qua các xupap vào tầng điều chỉnh đầu tiên của tuabin bằng phương pháp tiết lưu thì:",
   opts:["Nhiệt độ của hơi mới tăng lên, áp suất của dòng hơi giữ không thay đổi và lưu lượng giảm đi.",
         "Nhiệt độ của hơi mới giữ không đổi, áp suất của dòng hơi giảm đi, lưu lượng của dòng hơi giảm đi.",
         "Năng lượng entanpi của dòng hơi là hằng số, lưu lượng giảm đi."],
   ans:[2], ex:"Tiết lưu là quá trình entanpi không đổi; lưu lượng giảm."},
  {q:"Tuabin xung lực được hiểu là:",
   opts:["tuabin mà dòng hơi chỉ giãn nở trong các ống phun (hay trong các dãy cánh bất động), còn động năng của dòng hơi được chuyển hóa thành cơ công trong các dãy cánh động.",
         "tuabin mà dòng hơi không chỉ giãn nở và sinh công trong các ống phun (hay trong các dãy cánh bất động) mà còn cả trên dãy cánh động, động năng của dòng hơi được chuyển hóa thành cơ công trong các dãy cánh động của tuabin.",
         "tuabin mà dòng hơi chỉ giãn nở trong các dãy cánh động, và động năng của dòng hơi được chuyển hóa thành cơ công trong các dãy cánh động."],
   ans:[0], ex:"Tuabin xung lực: giãn nở chỉ trong ống phun; cánh động nhận động năng."},
  {q:"Tuabin ngưng hơi sử dụng trong các nhà máy nhiệt điện có công suất lớn thường:",
   opts:["Là tuabin ngưng hơi có trích hơi điều chỉnh, số cửa trích từ 3-5.",
         "Sử dụng từ 5 đến 9 cửa trích hơi cho gia nhiệt và hồi nhiệt nước cấp, tỷ lệ trích hơi có thể đạt đến 40% lượng hơi qua tuabin.",
         "Là tuabin đối áp, có số cửa trích từ 1-3 và áp suất sau tầng cánh cuối được sử dụng cho các mục đích công nghệ như sấy, sưởi, gia nhiệt."],
   ans:[1], ex:"Tuabin ngưng hơi công suất lớn có 5–9 cửa trích, trích tới ~40% lưu lượng hơi."},
  {q:"Trong các bộ chèn đầu trục của tuabin hơi, môi chất chèn hơi nước có tác dụng chính là:",
   opts:["Hạn chế lực dọc trục trong tuabin và bổ sung thêm lưu lượng hơi cho bình khử khí.",
         "Gia nhiệt cho các bình gia nhiệt cao áp, hạ áp và cải thiện hiệu suất của lò hơi.",
         "Không cho hơi nước có thông số cao và năng lượng lớn từ phần truyền dòng trong tuabin ra ngoài môi trường hoặc không cho không khí từ môi trường lọt vào bình ngưng."],
   ans:[2], ex:"Chèn trục ngăn hơi rò ra ngoài và ngăn không khí lọt vào bình ngưng."},
  {q:"Để xác định được trạng thái trong vùng hơi ẩm hay các thông số nhiệt động học của dòng hơi sau tầng cánh cuối cùng nằm trong vùng hơi ẩm, làm cơ sở tính toán hiệu suất trong tương đối phần hạ áp của tuabin ngưng hơi, chúng ta cần xác định được thông số nhiệt động sau:",
   opts:["Áp suất và nhiệt độ sau tầng cánh cuối cùng của tuabin.",
         "Áp suất hoặc nhiệt độ sau tầng cánh cuối cùng của tuabin và độ khô của hơi.",
         "Áp suất hoặc nhiệt độ sau tầng cánh cuối cùng của tuabin."],
   ans:[1], ex:"Vùng hơi ẩm cần thêm độ khô bên cạnh áp suất hoặc nhiệt độ."},
  {q:"Để mang lại hiệu quả kinh tế và kỹ thuật tốt nhất cho chu trình khi sử dụng tái nhiệt trung gian trong các nhà máy điện thì thông số nhiệt động của hơi nước sau tái nhiệt thường:",
   opts:["Áp suất hơi tái nhiệt ptn = (0,2÷0,3)po áp suất hơi mới đầu vào tuabin và nhiệt độ hơi tái nhiệt ttn = to nhiệt độ hơi mới đầu vào tuabin.",
         "Áp suất hơi tái nhiệt ptn < 0,2.po áp suất hơi mới đầu vào tuabin và nhiệt độ hơi tái nhiệt ttn = to nhiệt độ hơi mới đầu vào tuabin.",
         "Áp suất hơi tái nhiệt ptn > 0,3.po áp suất hơi mới đầu vào tuabin và nhiệt độ hơi tái nhiệt ttn = to nhiệt độ hơi mới đầu vào tuabin."],
   ans:[0], ex:"Thông số tối ưu: ptn = (0,2÷0,3)po và ttn = to."},
  {q:"Khi nâng cao thông số nhiệt độ hơi mới lên trên 535°C và áp suất hơi mới đầu vào tuabin đến giá trị cận và trên tới hạn (> 165 bar) thì:",
   opts:["Việc áp dụng bộ tái nhiệt hay quá nhiệt trung gian hơi nước là yêu cầu bắt buộc đối với chu trình nhiệt tuabin ngưng hơi để cải thiện hiệu suất chu trình.",
         "Nên sử dụng tuabin ngưng hơi một thân và không có quá nhiệt trung gian.",
         "Việc áp dụng bộ tái nhiệt hay quá nhiệt trung gian hơi nước là không cần thiết hay không bắt buộc đối với chu trình nhiệt tuabin ngưng hơi."],
   ans:[0], ex:"Thông số cận/trên tới hạn bắt buộc phải có tái nhiệt trung gian."},
  {q:"Đối với các tuabin ngưng hơi công suất lớn sử dụng trong các nhà máy điện hiện đại, chiều và lưu lượng dòng hơi đi trong các phần cao - trung - hạ áp thường có đặc điểm:",
   opts:["Đi theo một chiều cố định mà không đảo chiều, nằm trong một thân tuabin để giảm bớt tổn thất thủy lực của dòng hơi từ đầu vào đến đầu ra.",
         "Đi thành một dòng mà không chia tách, không đảo chiều, tăng cường trích hơi để gia nhiệt và hồi nhiệt nước cấp càng nhiều càng tốt.",
         "Đi theo chiều đối xứng (hay ngược nhau) và với lưu lượng tương đồng nhau nhằm hạn chế tối đa lực dọc trục và nâng cao tối đa công suất giới hạn của các tầng cánh cuối."],
   ans:[2], ex:"Dòng đối xứng/ngược chiều, lưu lượng tương đồng để triệt lực dọc trục."},
  {q:"Dọc theo phần truyền dòng của tuabin hơi nhiều tầng, từ đầu vào là phần cao áp đến đầu ra là phần hạ áp, chiều cao của các tầng cánh tương ứng là tiết diện phần lưu thoát của dòng hơi:",
   opts:["Sẽ tăng dần theo sự giảm nhiệt độ, sự giảm áp suất của dòng hơi hoặc được điều chỉnh giảm phù hợp với sự giảm lưu lượng hơi tại vị trí các cửa trích.",
         "Sẽ giữ ổn định từ đầu vào đến đầu ra của tuabin, mà không thay đổi dù có sự thay đổi của các thông số trong dòng hơi.",
         "Sẽ giảm dần do sự giảm của nhiệt độ, giảm áp suất của dòng hơi từ đầu vào đến đầu ra của tuabin."],
   ans:[0], ex:"Tiết diện lưu thoát tăng dần khi hơi giãn nở (giảm p, t)."},
  {q:"Theo dòng hơi đi trong các tuabin, tầng cánh đầu tiên thuộc phần cao áp thường được thiết kế và chế tạo là:",
   opts:["Kiểu tầng cánh phản lực để nâng cao hiệu suất chuyển đổi năng lượng trong tầng và hạn chế sự tạo xoáy trong dãy cánh động.",
         "Kiểu tầng cánh xung lực hoặc có sự giãn nở rất nhỏ trong các tầng cánh động để có nhiệt giáng tầng cánh lớn và nâng cao hiệu suất chuyển đổi năng lượng trong tầng.",
         "Dạng tầng cánh dài và xoắn để hạn chế các tổn thất do dòng hơi ẩm."],

/* ====== RENDER & LOGIC (giữ nguyên của bạn) ====== */
const form = document.getElementById('quiz');
const progressEl = document.getElementById('progress');
const summaryEl = document.getElementById('summary');
const LETTERS = ['A','B','C'];
function isMulti(item){ return item.ans.length > 1; }
function render(){
  form.innerHTML = QUESTIONS.map((item, i) => {
    const multi = isMulti(item);
    const inputType = multi ? 'checkbox' : 'radio';
    return `
    <div class="q" id="q-${i}">
      <span class="num ${multi?'multi':''}">Câu ${i+1}</span>
      <div class="stem">${item.q}</div>
      ${item.opts.map((o, j) => `
        <label class="opt" id="opt-${i}-${j}">
          <input type="${inputType}" name="q${i}" value="${j}" onchange="onSelect(${i})">
          <span class="label">${LETTERS[j]}.</span>
          <span class="text">${o}</span>
        </label>
      `).join('')}
      <div class="explain" id="ex-${i}"></div>
    </div>
  `}).join('');
}
function getChecked(i){
  return Array.from(document.querySelectorAll(`input[name="q${i}"]:checked`)).map(el => Number(el.value));
}
function gradeOne(i){
  const item = QUESTIONS[i];
  const qBox = document.getElementById(`q-${i}`);
  const ex = document.getElementById(`ex-${i}`);
  const chosen = getChecked(i);
  qBox.classList.remove('result-correct','result-wrong','result-partial');
  item.opts.forEach((_, j) => {
    const el = document.getElementById(`opt-${i}-${j}`);
    el.classList.remove('correct','wrong','missed','sel');
  });
  item.opts.forEach((_, j) => {
    const el = document.getElementById(`opt-${i}-${j}`);
    const isCorrect = item.ans.includes(j);
    const isChosen = chosen.includes(j);
    if(isCorrect) el.classList.add('correct');
    else if(isChosen) el.classList.add('wrong');
    if(isMulti(item) && isCorrect && !isChosen) el.classList.add('missed');
  });
  if(chosen.length === 0){
    ex.className = 'explain show';
    ex.innerHTML = `<span class="tag">✔ Đáp án đúng: ${item.ans.map(a=>LETTERS[a]).join(', ')}.</span> ${item.ex}`;
    return {status:'unanswered'};
  }
  const sameLen = chosen.length === item.ans.length;
  const sameSet = sameLen && item.ans.every(a => chosen.includes(a));
  if(sameSet){
    qBox.classList.add('result-correct');
    ex.className = 'explain show';
    ex.innerHTML = `<span class="tag">✔ Chính xác! Đáp án: ${item.ans.map(a=>LETTERS[a]).join(', ')}.</span> ${item.ex}`;
    return {status:'correct'};
  } else if(isMulti(item) && chosen.some(c => item.ans.includes(c))){
    qBox.classList.add('result-partial');
    ex.className = 'explain show';
    ex.innerHTML = `<span class="tag partial">◐ Đúng một phần. Đáp án đầy đủ: ${item.ans.map(a=>LETTERS[a]).join(', ')}.</span> ${item.ex}`;
    return {status:'partial'};
  } else {
    qBox.classList.add('result-wrong');
    ex.className = 'explain show';
    ex.innerHTML = `<span class="tag wrong">✘ Chưa đúng. Đáp án đúng: ${item.ans.map(a=>LETTERS[a]).join(', ')}.</span> ${item.ex}`;
    return {status:'wrong'};
  }
}
function onSelect(i){
  document.querySelectorAll(`#q-${i} .opt`).forEach(el => el.classList.remove('sel'));
  const chosen = getChecked(i);
  chosen.forEach(j => document.getElementById(`opt-${i}-${j}`).classList.add('sel'));
  gradeOne(i);
  updateProgress();
}
function updateProgress(){
  let n = 0;
  for(let i=0;i<QUESTIONS.length;i++){
    if(getChecked(i).length > 0) n++;
  }
  progressEl.textContent = `Đã trả lời: ${n}/${QUESTIONS.length}`;
}
function checkAll(){
  let correct=0, partial=0, wrong=0, unanswered=0;
  QUESTIONS.forEach((_, i) => {
    const r = gradeOne(i);
    if(r.status==='correct') correct++;
    else if(r.status==='partial') partial++;
    else if(r.status==='wrong') wrong++;
    else unanswered++;
  });
  const total = QUESTIONS.length;
  const scoreVal = correct + partial*0.5;
  const pct = Math.round(scoreVal/total*100);
  document.getElementById('score').textContent = `${correct}/${total}`;
  document.getElementById('detail').textContent =
    `Đúng ${correct} · Đúng một phần ${partial} · Sai ${wrong} · Chưa trả lời ${unanswered} · Điểm ~${pct}%`;
  let msg = "";
  if(unanswered > 0) msg = "⚠️ Bạn còn câu chưa trả lời. Hãy xem lại các câu chưa chọn đáp án.";
  else if(pct >= 90) msg = "🏆 Xuất sắc! Bạn nắm rất vững lý thuyết tuabin.";
  else if(pct >= 75) msg = "👍 Khá tốt! Hãy xem lại các câu sai để hoàn thiện.";
  else if(pct >= 50) msg = "📘 Cần ôn thêm. Chú ý các câu về chế độ vận hành và sự cố.";
  else msg = "📚 Hãy đọc lại tài liệu và làm lại bài để củng cố kiến thức.";
  document.getElementById('msg').textContent = msg;
  summaryEl.classList.add('show');
  window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'});
}
function resetAll(){
  form.reset();
  summaryEl.classList.remove('show');
  QUESTIONS.forEach((_, i) => {
    document.getElementById(`q-${i}`).classList.remove('result-correct','result-wrong','result-partial');
    document.getElementById(`ex-${i}`).classList.remove('show');
    document.getElementById(`ex-${i}`).innerHTML = '';
    document.querySelectorAll(`#q-${i} .opt`).forEach(el => el.classList.remove('sel','correct','wrong','missed'));
  });
  updateProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}
render();
updateProgress();
</script>
