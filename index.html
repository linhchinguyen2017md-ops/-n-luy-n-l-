<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Ôn tập & Kiểm tra</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .menu-container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .btn {
            display: block;
            padding: 18px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .btn-exam { 
            background-color: #2ea44f; /* Màu xanh lá cây cho bài thi */
        } 
        .btn-theory { 
            background-color: #0366d6; /* Màu xanh dương cho lý thuyết */
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <h1>Chào mừng bạn đến với hệ thống ôn tập</h1>
        
        <div class="button-group">
            <!-- Bấm vào đây sẽ mở file thi trắc nghiệm -->
            <a href="tracnghiemlo.html" class="btn btn-exam">
                📝 Vào phần Thi Trắc Nghiệm
            </a>
            
            <!-- Bấm vào đây sẽ mở file lý thuyết an toàn -->
            <a href="lythuyet.html" class="btn btn-theory">
                📚 Vào phần Lý Thuyết An Toàn
            </a>
        </div>
    </div>

</body>
</html>
