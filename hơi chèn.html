         "Cả 3 phương án trên"],
   ans:[3], ex:"3 nguồn: ống góp hơi tự dùng, tự chèn từ tuabin CA–TA, rút hơi rò từ ty van."},
  {q:"Hệ thống hơi chèn bao gồm các thiết bị chính sau đây:",
   opts:["Quạt hút hơi chèn, Bình ngưng hơi chèn, ống góp hơi chèn, hộp nước xả đọng của bình ngưng hơi chèn.",
         "Quạt hút hơi chèn, Bình ngưng hơi chèn, bơm dầu bôi trơn, ống góp hơi chèn, hộp nước xả đọng của bình ngưng hơi chèn.",
         "Quạt hút hơi chèn, bơm chân không hộp nước, bình ngưng hơi chèn, ống góp hơi chèn, hộp nước xả đọng của bình ngưng hơi chèn.",
         "Quạt hút hơi chèn, Bình ngưng hơi chèn, bơm dầu chèn, ống góp hơi chèn, hộp nước xả đọng của bình ngưng hơi chèn."],
   ans:[0], ex:"Thiết bị chính: quạt hút hơi chèn, bình ngưng hơi chèn, ống góp hơi chèn, hộp nước xả đọng."}
];
const form=document.getElementById('quiz'),progressEl=document.getElementById('progress'),summaryEl=document.getElementById('summary');
const LETTERS=['A','B','C','D'],TOTAL=QUESTIONS.length;
const isMulti=item=>item.ans.length>1;
function render(){
  form.innerHTML=QUESTIONS.map((item,i)=>{
    const multi=isMulti(item),type=multi?'checkbox':'radio';
    return `<div class="q" id="q-${i}">
      <span class="num ${multi?'multi':''}">Câu ${i+1}</span>
      <div class="stem">${item.q}</div>
      ${item.opts.map((o,j)=>`<label class="opt" id="opt-${i}-${j}"><input type="${type}" name="q${i}" value="${j}" onchange="onSelect(${i})"><span class="label">${LETTERS[j]}.</span><span class="text">${o}</span></label>`).join('')}
      <div class="explain" id="ex-${i}"></div>
    </div>`;
  }).join('');
}
const getChecked=i=>Array.from(document.querySelectorAll(`input[name="q${i}"]:checked`)).map(el=>Number(el.value));
function gradeOne(i){
  const item=QUESTIONS[i],qBox=document.getElementById(`q-${i}`),ex=document.getElementById(`ex-${i}`),chosen=getChecked(i);
  qBox.classList.remove('result-correct','result-wrong','result-partial');
  item.opts.forEach((_,j)=>{const el=document.getElementById(`opt-${i}-${j}`);el.classList.remove('correct','wrong','missed','sel');});
  item.opts.forEach((_,j)=>{
    const el=document.getElementById(`opt-${i}-${j}`),isC=item.ans.includes(j),isCh=chosen.includes(j);
    if(isC)el.classList.add('correct');else if(isCh)el.classList.add('wrong');
    if(isMulti(item)&&isC&&!isCh)el.classList.add('missed');
  });
  if(chosen.length===0){ex.className='explain show';ex.innerHTML=`<span class="tag">✔ Đáp án đúng: ${item.ans.map(a=>LETTERS[a]).join(', ')}.</span> ${item.ex}`;return{status:'unanswered'};}
  const sameSet=chosen.length===item.ans.length&&item.ans.every(a=>chosen.includes(a));
  if(sameSet){qBox.classList.add('result-correct');ex.className='explain show';ex.innerHTML=`<span class="tag">✔ Chính xác! Đáp án: ${item.ans.map(a=>LETTERS[a]).join(', ')}.</span> ${item.ex}`;return{status:'correct'};}
  else if(isMulti(item)&&chosen.some(c=>item.ans.includes(c))){qBox.classList.add('result-partial');ex.className='explain show';ex.innerHTML=`<span class="tag partial">◐ Đúng một phần. Đáp án đầy đủ: ${item.ans.map(a=>LETTERS[a]).join(', ')}.</span> ${item.ex}`;return{status:'partial'};}
  else{qBox.classList.add('result-wrong');ex.className='explain show';ex.innerHTML=`<span class="tag wrong">✘ Chưa đúng. Đáp án đúng: ${item.ans.map(a=>LETTERS[a]).join(', ')}.</span> ${item.ex}`;return{status:'wrong'};}
}
function onSelect(i){
  document.querySelectorAll(`#q-${i} .opt`).forEach(el=>el.classList.remove('sel'));
  getChecked(i).forEach(j=>document.getElementById(`opt-${i}-${j}`).classList.add('sel'));
  gradeOne(i);updateProgress();
}
function updateProgress(){let n=0;for(let i=0;i<TOTAL;i++){if(getChecked(i).length>0)n++;}progressEl.textContent=`Đã trả lời: ${n}/${TOTAL}`;}
function checkAll(){
  let c=0,p=0,w=0,u=0;
  QUESTIONS.forEach((_,i)=>{const r=gradeOne(i);if(r.status==='correct')c++;else if(r.status==='partial')p++;else if(r.status==='wrong')w++;else u++;});
  const pct=Math.round((c+p*0.5)/TOTAL*100);
  document.getElementById('score').textContent=`${c}/${TOTAL}`;
  document.getElementById('detail').textContent=`Đúng ${c} · Đúng một phần ${p} · Sai ${w} · Chưa trả lời ${u} · Điểm ~${pct}%`;
  let msg="";if(u>0)msg="⚠️ Bạn còn câu chưa trả lời.";else if(pct>=90)msg="🏆 Xuất sắc!";else if(pct>=75)msg="👍 Khá tốt!";else if(pct>=50)msg="📘 Cần ôn thêm.";else msg="📚 Hãy đọc lại tài liệu và làm lại.";
  document.getElementById('msg').textContent=msg;summaryEl.classList.add('show');window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
function resetAll(){
  form.reset();summaryEl.classList.remove('show');
  QUESTIONS.forEach((_,i)=>{document.getElementById(`q-${i}`).classList.remove('result-correct','result-wrong','result-partial');const ex=document.getElementById(`ex-${i}`);ex.classList.remove('show');ex.innerHTML='';document.querySelectorAll(`#q-${i} .opt`).forEach(el=>el.classList.remove('sel','correct','wrong','missed'));});
  updateProgress();window.scrollTo({top:0,behavior:'smooth'});
}
render();updateProgress();
</script>
</body>
