<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trắc nghiệm: Bi làm sạch bình ngưng</title>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--primary:#0891b2;--primary-dark:#0e7490;--border:#e5e7eb;--correct:#16a34a;--correct-bg:#ecfdf5;--wrong:#dc2626;--wrong-bg:#fef2f2;--partial:#d97706;--partial-bg:#fffbeb;}
  *{box-sizing:border-box;}
  body{margin:0;padding:24px 12px;background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,Arial,sans-serif;line-height:1.55;}
  .wrap{max-width:900px;margin:0 auto;}
  header{background:linear-gradient(135deg,#164e63,#0891b2);color:#fff;padding:24px 28px;border-radius:14px;margin-bottom:20px;box-shadow:0 6px 20px rgba(8,145,178,.25);}

  header p{margin:0;opacity:.9;font-size:.95rem;}
  .toolbar{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .toolbar .progress{margin-left:auto;font-size:.9rem;color:var(--muted);}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 18px;font-weight:600;transition:.18s;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{background:#fff;color:var(--text);border:1px solid var(--border);}
  .btn-ghost:hover{background:#f3f4f6;}
  .section-title{background:#cffafe;color:#164e63;font-weight:700;padding:10px 16px;border-radius:10px;margin:22px 0 12px;font-size:1rem;border-left:5px solid var(--primary);}
  .q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .q .num{display:inline-block;background:#cffafe;color:var(--primary-dark);font-weight:700;font-size:.8rem;padding:2px 10px;border-radius:999px;margin-bottom:10px;}
  .q .num.multi{background:#fef3c7;color:#b45309;}
  .q .num.multi::after{content:" · nhiều đáp án";}
  .q .stem{font-weight:600;margin-bottom:12px;}
  .opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:.15s;background:#fff;}
  .opt:hover{background:#f9fafb;border-color:#67e8f9;}
  .opt input{margin-top:4px;accent-color:var(--primary);cursor:pointer;}
  .opt .label{font-weight:700;color:var(--primary-dark);min-width:18px;}
  .opt.sel{border-color:var(--primary);background:#ecfeff;}
  .opt.correct{border-color:var(--correct);background:var(--correct-bg);}
  .opt.wrong{border-color:var(--wrong);background:var(--wrong-bg);}
  .opt.missed{border-color:var(--partial);background:var(--partial-bg);}
  .opt.correct .label{color:var(--correct);}
  .opt.wrong .label{color:var(--wrong);}
  .opt.missed .label{color:var(--partial);}
  .explain{display:none;margin-top:10px;padding:12px 14px;border-radius:10px;background:#f8fafc;border-left:4px solid var(--primary);font-size:.93rem;}
  .explain.show{display:block;}
  .explain .tag{font-weight:700;color:var(--correct);}
  .explain .tag.partial{color:var(--partial);}
  .explain .tag.wrong{color:var(--wrong);}
  .q.result-correct{border-color:var(--correct);}
  .q.result-wrong{border-color:var(--wrong);}
  .q.result-partial{border-color:var(--partial);}
  .summary{display:none;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin-top:18px;text-align:center;}
  .summary.show{display:block;}
  .summary .score{font-size:2.6rem;font-weight:800;color:var(--primary);}
  .summary .detail{color:var(--muted);margin-top:4px;}
  .summary .msg{margin-top:12px;font-weight:600;}
  @media (max-width:520px){header{padding:18px;}header h1{font-size:1.2rem;}.toolbar .progress{width:100%;margin-left:0;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>HỆ THỐNG 4: BI LÀM SẠCH BÌNH NGƯNG</h1>
    <p>25 câu hỏi (Câu 99–123) – Đáp án và giải thích hiện ngay khi bạn chọn. Có 2 câu nhiều đáp án.</p>

<script>
const QUESTIONS = [
  {q:"Nội dung nào sau đây là đúng nhất về chức năng nhiệm vụ hệ thống làm sạch bình ngưng?",

         "Hệ thống làm sạch các đường ống tuần hoàn nhằm duy trì khả năng truyền nhiệt tốt nhất, đảm bảo môi trường chân không trong hộp nước. Hệ thống sẽ luân chuyển các bi cao su xuyên suốt các ống bình ngưng để loại bỏ các tạp chất cáu bẩn nếu có.",
         "Hệ thống làm sạch các đường ống bình ngưng nhằm duy trì khả năng truyền nhiệt tốt nhất, đảm bảo môi trường chân không trong bình ngưng. Hệ thống sẽ luân chuyển các bi cao su xuyên suốt các tấm trao đổi nhiệt trong bình ngưng để loại bỏ các tạp chất cáu bẩn nếu có.",
         "Hệ thống làm sạch các đường ống bình ngưng nhằm duy trì khả năng truyền nhiệt tốt nhất, đảm bảo môi trường chân không hộp nước tuần hoàn. Hệ thống sẽ luân chuyển các bi cao su xuyên suốt các ống tuần hoàn để loại bỏ các tạp chất cáu bẩn nếu có."],
   ans:[0], ex:"Làm sạch ống bình ngưng, duy trì truyền nhiệt và chân không; bi cao su luân chuyển xuyên suốt ống bình ngưng."},
  {q:"Nội dung nào sau đây là đúng nhất về bơm tuần hoàn bi hệ thống làm sạch bình ngưng?",

         "Bơm ly tâm với thiết kế riêng về bánh công tác, khả năng xử lý chất rắn, chất mềm chịu áp lực thích hợp để đưa và thu gom bi cao su trong đầu vào và đầu ra của bình ngưng tương ứng.",
         "Bơm trục vít với thiết kế riêng về bánh công tác, khả năng xử lý chất rắn, chất mềm chịu áp lực thích hợp để đưa và thu gom bi cao su trong đầu vào và đầu ra của đường ống nước tuần hoàn tương ứng.",
         "Bơm ly tâm với thiết kế riêng về bánh công tác, khả năng xử lý chất rắn, chất mềm chịu áp lực thích hợp để đưa và thu gom bi cao su trong đầu vào và đầu ra của đường ống nước tuần hoàn tương ứng."],
   ans:[1], ex:"Bơm ly tâm, thiết kế riêng bánh công tác, xử lý chất rắn/mềm, đưa và thu gom bi ở đầu vào/ra bình ngưng."},
  {q:"Chất lỏng được xử lý trong hệ thống làm sạch bình ngưng?",
   opts:["Nước dịch vụ","Nước khử khoáng","Nước biển","Nước ngưng"],ans:[2], ex:"Chất lỏng xử lý là nước biển."},
  {q:"Đường kính bộ thu bi đầu ra hộp nước tuần hoàn?",
   opts:["DN 1665","DN 1660","DN 1655","DN 1650"],ans:[3], ex:"Đường kính bộ thu bi: DN 1650."},
  {q:"Tổng số ống trao đổi nhiệt mỗi bình ngưng:",
   opts:["39304","39404","39504","39604"],ans:[0], ex:"Tổng số ống mỗi bình ngưng: 39304."},
  {q:"Tổng số ống mỗi hộp nước?",
   opts:["9726","9826","9626","9526"],ans:[1], ex:"Tổng số ống mỗi hộp nước: 9826."},
  {q:"Vật liệu ống trao đổi nhiệt bình ngưng?",
   opts:["Ống đồng","Hastenlloy","Titanium","Inox"],ans:[2], ex:"Vật liệu ống: Titanium."},
  {q:"Lưu lượng nước tuần hoàn tối đa mỗi nhánh bình ngưng:",
   opts:["20500 m3/h","22500 m3/h","21000 m3/h","21500 m3/h"],ans:[3], ex:"Lưu lượng tối đa mỗi nhánh: 21500 m³/h."},
  {q:"Số lượng bi cần thiết cho mỗi nhánh bình ngưng theo quy định?",

  {q:"Quá trình rửa ngược bình thường diễn ra khi chênh áp qua lưới lọc bi vượt quá:",
   opts:["35 mbar","30 mbar","40 mbar","45 mbar"],ans:[1], ex:"Rửa ngược bình thường khi chênh áp > 30 mbar."},
  {q:"Quá trình rửa ngược khẩn cấp diễn ra khi chênh áp qua lưới lọc bi vượt quá:",
   opts:["50 mbar","55 mbar","60 mbar","65 mbar"],ans:[2], ex:"Rửa ngược khẩn cấp khi chênh áp > 60 mbar."},
  {q:"Nội dung nào sau đây là đúng về mô tả bơm tuần hoàn bi?",
   opts:["Bơm trục vít nằm ngang loại không tắc nghẽn","Bơm ly tâm nằm ngang","Bơm ly tâm trục đứng loại không tắc nghẽn","Bơm ly tâm nằm ngang loại không tắc nghẽn"],
   ans:[3], ex:"Bơm ly tâm nằm ngang loại không tắc nghẽn."},
  {q:"Nội dung nào sau đây là đúng về cột áp/ công suất bơm tuần hoàn bi:",
   opts:["21mH2O/ 5.5 kW","18mH2O/ 5.5 kW","18mH2O/7.5 kW","21mH2O/ 7.5 kW"],ans:[0], ex:"Cột áp/công suất: 21 mH2O / 5.5 kW."},
  {q:"Nội dung nào sau đây là đúng nhất về ưu điểm chính của hệ thống làm sạch ống bình ngưng:",
   opts:["Nâng cao hệ số truyền nhiệt. Hiệu suất chu trình nhiệt giảm. Tránh ăn mòn trong ống. Tránh phải ngừng máy để làm sạch bằng tay. Tiết kiệm chi phí hóa chất. Giảm chi phí nhiên liệu. Hạn chế hư hỏng ống.",
         "Nâng cao hệ số truyền nhiệt. Hiệu suất chu trình nhiệt tăng. Tránh ăn mòn trong ống. Tránh phải ngừng máy để làm sạch bằng tay. Tiết kiệm chi phí hóa chất. Giảm chi phí nhiên liệu. Hạn chế hư hỏng ống.",
         "Nâng cao hệ số truyền nhiệt. Hiệu suất chu trình nhiệt tăng. Tránh ăn mòn trong ống. Tránh phải ngừng máy để làm sạch bằng tay. Tiết kiệm chi phí hóa chất. Giảm chi phí nhiên liệu.",
         "Nâng cao hệ số trao đổi nhiệt. Hiệu suất chu trình nhiệt giảm. Tránh ăn mòn trong ống. Hạn chế làm sạch bằng tay. Tiết kiệm chi phí hóa chất. Giảm chi phí nhiên liệu. Hạn chế hư hỏng ống."],
   ans:[1], ex:"Ưu điểm: tăng truyền nhiệt, tăng hiệu suất chu trình, tránh ăn mòn, tránh ngừng máy, tiết kiệm hóa chất, giảm chi phí nhiên liệu, hạn chế hư hỏng ống."},
  {q:"Hệ thống bi làm sạch bình ngưng nhà máy NĐMD có bao nhiêu bộ chia bi?",
   opts:["4","8","6","10"],ans:[1], ex:"Có 8 bộ chia bi."},
  {q:"Nội dung nào sau đây là đúng về mô tả thiết bị gom của hệ thống bi làm sạch bình ngưng nhà máy NĐMD:",
   opts:["Thiết bị gom bi không có bộ phận chuyển động và do đó không cần bảo trì. Các thiết bị thu gom được sử dụng để thu hồi các viên bi làm sạch và phục hồi giống nhau. DP tự động phân loại bi bằng máy tách bi và phân loại các viên bi có kích thước nhỏ hơn ống bình ngưng 20mm trở lên loại bỏ ra ngoài.",
         "Thiết bị gom bi không có bộ phận chuyển động và do đó không cần bảo trì. Các thiết bị thu gom được sử dụng để thu hồi các viên bi làm sạch và phân loại chúng. DP tự động phân loại bi bằng máy tách bi và phân loại các viên bi không đạt tiêu chuẩn thì tự lọt qua mặt sàng loại bỏ ra ngoài.",
         "Thiết bị gom bi không có bộ phận chuyển động nên cần bảo trì thường xuyên. Các thiết bị thu gom được sử dụng để thu hồi các viên bi làm sạch và phục hồi giống nhau. DP tự động phân loại bi bằng máy tách bi và phân loại các viên bi không đạt tiêu chuẩn thì tự lọt qua mặt sàng loại bỏ ra ngoài.",
         "Thiết bị gom bi không có bộ phận chuyển động và do đó không cần bảo trì. Các thiết bị thu gom được sử dụng để thu hồi các viên bi làm sạch và phục hồi giống nhau. DP tự động phân loại bi bằng máy tách bi và phân loại các viên bi không đạt tiêu chuẩn thì tự lọt qua mặt sàng loại bỏ ra ngoài."],
   ans:[3], ex:"Thiết bị gom: không có bộ phận chuyển động, không cần bảo trì; thu hồi bi và phục hồi; bi không đạt chuẩn lọt qua mặt sàng loại bỏ."},
  {q:"Áp suất hoạt động bộ lọc bi?",
   opts:["2.1 bar","2.2 bar","2.3 bar","2.4 bar"],ans:[0], ex:"Áp suất hoạt động bộ lọc bi: 2.1 bar."},
  {q:"Đường kính bi làm sạch bình ngưng?",
   opts:["25mm RB","26mm RB","24mm RB","27mm RB"],ans:[1], ex:"Đường kính bi: 26mm RB."},
  {q:"Bi làm sạch bình ngưng sẽ bị loại nếu kích thước nhỏ hơn?",
   opts:["20mm RB","18mmRB","15mmRB","13mmRB"],ans:[2], ex:"Bi bị loại nếu < 15mm RB."},
  {q:"Công suất làm việc bơm tuần hoàn bi:",
   opts:["65m3/giờ","55m3/giờ","70m3/giờ","60m3/giờ"],ans:[3], ex:"Công suất: 60 m³/giờ."},
  {q:"Nguyên nhân của sự cố tổn thất bi làm sạch bình ngưng nhiều:",
   opts:["Tấm lưới chặn không ở trạng thái làm việc.",
         "Khe hở lưới chặn quá lớn.",
         "Bộ đếm bi vận hành sai.",
         "Lưới chặn hoặc đường trích bi ra bị hư hỏng."],
   ans:[0,1,3], ex:"Đáp án đúng: A, B, D (tấm lưới chặn không ở trạng thái làm việc; khe hở lưới chặn quá lớn; lưới chặn/đường trích bi hư hỏng)."},
  {q:"Nguyên nhân của sự cố bơm bi không bơm được nước:",
   opts:["Bơm chưa được điền đầy.",
         "Bơm thiếu dầu.",
         "Áp lực đầu hút không đạt yêu cầu.",
         "Có vật lạ trong bơm."],
   ans:[0,2,3], ex:"Đáp án đúng: A, C, D (bơm chưa điền đầy; áp lực đầu hút không đạt; có vật lạ trong bơm)."},
  {q:"Thời gian cài đặt theo PLC để cho nước trộn với bi làm sạch bình ngưng là bao lâu?",
   opts:["5 phút","10 phút","15 phút","20 phút"],ans:[0], ex:"Thời gian trộn: 5 phút."},
  {q:"Khi vận hành tự động hệ thống bi làm sạch bình ngưng được hẹn giờ trong chế độ chờ là bao lâu?",
   opts:["8 giờ","16 giờ","18 giờ","24 giờ"],ans:[0], ex:"Chế độ chờ hẹn giờ: 8 giờ."},
  {q:"Khi dừng hệ thống với chế độ tự động, thời gian cho phép để thu bi lại trong bộ thu bi là bao lâu?",
   opts:["15 phút","30 phút","60 phút","90 phút"],ans:[1], ex:"Thời gian thu bi: 30 phút."}
];
const form=document.getElementById('quiz'),progressEl=document.getElementById('progress'),summaryEl=document.getElementById('summary');
const LETTERS=['A','B','C','D'],TOTAL=QUESTIONS.length;
const isMulti=item=>item.ans.length>1;
function render(){
  form.innerHTML=QUESTIONS.map((item,i)=>{
    const multi=isMulti(item),type=multi?'checkbox':'radio';
    return `<div class="q" id="q-${i}">
      <span class="num ${multi?'multi':''}">Câu ${i+1}</span>
      <div class="stem">${item.q}</div>
      ${item.opts.map((o,j)=>`<label class="opt" id="opt-${i}-${j}"><input type="${type}" name="q${i}" value="${j}" onchange="onSelect(${i})"><span class="label">${LETTERS[j]}.</span><span class="text">${o}</span></label>`).join('')}
      <div class="explain" id="ex-${i}"></div>
    </div>`;
  }).join('');
}
const getChecked=i=>Array.from(document.querySelectorAll(`input[name="q${i}"]:checked`)).map(el=>Number(el.value));
function gradeOne(i){
  const item=QUESTIONS[i],qBox=document.getElementById(`q-${i}`),ex=document.getElementById(`ex-${i}`),chosen=getChecked(i);
  qBox.classList.remove('result-correct','result-wrong','result-partial');
  item.opts.forEach((_,j)=>{const el=document.getElementById(`opt-${i}-${j}`);el.classList.remove('correct','wrong','missed','sel');});
  item.opts.forEach((_,j)=>{
    const el=document.getElementById(`opt-${i}-${j}`),isC=item.ans.includes(j),isCh=chosen.includes(j);
    if(isC)el.classList.add('correct');else if(isCh)el.classList.add('wrong');
    if(isMulti(item)&&isC&&!isCh)el.classList.add('missed');
  });
  if(chosen.length===0){ex.className='explain show';ex.innerHTML=`<span class="tag">✔ Đáp án đúng: ${item.ans.map(a=>LETTERS[a]).join(', ')}.</span> ${item.ex}`;return{status:'unanswered'};}
  const sameSet=chosen.length===item.ans.length&&item.ans.every(a=>chosen.includes(a));
  if(sameSet){qBox.classList.add('result-correct');ex.className='explain show';ex.innerHTML=`<span class="tag">✔ Chính xác! Đáp án: ${item.ans.map(a=>LETTERS[a]).join(', ')}.</span> ${item.ex}`;return{status:'correct'};}
  else if(isMulti(item)&&chosen.some(c=>item.ans.includes(c))){qBox.classList.add('result-partial');ex.className='explain show';ex.innerHTML=`<span class="tag partial">◐ Đúng một phần. Đáp án đầy đủ: ${item.ans.map(a=>LETTERS[a]).join(', ')}.</span> ${item.ex}`;return{status:'partial'};}
  else{qBox.classList.add('result-wrong');ex.className='explain show';ex.innerHTML=`<span class="tag wrong">✘ Chưa đúng. Đáp án đúng: ${item.ans.map(a=>LETTERS[a]).join(', ')}.</span> ${item.ex}`;return{status:'wrong'};}
}
function onSelect(i){
  document.querySelectorAll(`#q-${i} .opt`).forEach(el=>el.classList.remove('sel'));
  getChecked(i).forEach(j=>document.getElementById(`opt-${i}-${j}`).classList.add('sel'));
  gradeOne(i);updateProgress();
}
function updateProgress(){let n=0;for(let i=0;i<TOTAL;i++){if(getChecked(i).length>0)n++;}progressEl.textContent=`Đã trả lời: ${n}/${TOTAL}`;}
function checkAll(){
  let c=0,p=0,w=0,u=0;
  QUESTIONS.forEach((_,i)=>{const r=gradeOne(i);if(r.status==='correct')c++;else if(r.status==='partial')p++;else if(r.status==='wrong')w++;else u++;});
  const pct=Math.round((c+p*0.5)/TOTAL*100);
  document.getElementById('score').textContent=`${c}/${TOTAL}`;
  document.getElementById('detail').textContent=`Đúng ${c} · Đúng một phần ${p} · Sai ${w} · Chưa trả lời ${u} · Điểm ~${pct}%`;
  let msg="";if(u>0)msg="⚠️ Bạn còn câu chưa trả lời.";else if(pct>=90)msg="🏆 Xuất sắc!";else if(pct>=75)msg="👍 Khá tốt!";else if(pct>=50)msg="📘 Cần ôn thêm.";else msg="📚 Hãy đọc lại tài liệu và làm lại.";
  document.getElementById('msg').textContent=msg;summaryEl.classList.add('show');window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
function resetAll(){
  form.reset();summaryEl.classList.remove('show');
  QUESTIONS.forEach((_,i)=>{document.getElementById(`q-${i}`).classList.remove('result-correct','result-wrong','result-partial');const ex=document.getElementById(`ex-${i}`);ex.classList.remove('show');ex.innerHTML='';document.querySelectorAll(`#q-${i} .opt`).forEach(el=>el.classList.remove('sel','correct','wrong','missed'));});
  updateProgress();window.scrollTo({top:0,behavior:'smooth'});
}
render();updateProgress();
</script>
