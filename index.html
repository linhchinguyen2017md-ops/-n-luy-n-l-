<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Đào Tạo Vận Hành - NĐMD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Montserrat', sans-serif; background: radial-gradient(circle at center, #1e3c72 0%, #0f1a2c 100%); min-height: 100vh; color: #fff; overflow-x: hidden; perspective: 1200px; }

        /* ================= CÁC MÀN HÌNH CHUNG ================= */
        .screen { display: none; min-height: 100vh; animation: fadeIn 0.4s ease; }
        .screen.active { display: flex; flex-direction: column; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* ================= 1. TRANG CHỦ ================= */
        #homeScreen { justify-content: center; align-items: center; padding: 20px 15px 115px; }
        
        /* CSS 3D Boiler (Giữ nguyên) */
        .scene-3d { position: relative; width: 100%; height: 280px; display: flex; justify-content: center; align-items: flex-end; margin-bottom: 12px; }
        .boiler { position: relative; width: 150px; height: 200px; background: linear-gradient(135deg, #444 0%, #999 50%, #222 100%); border-radius: 15px 15px 5px 5px; box-shadow: inset -15px 0 20px rgba(0,0,0,0.6), inset 15px 0 20px rgba(255,255,255,0.2), 20px 25px 35px rgba(0,0,0,0.7); transform: rotateY(-20deg) rotateX(5deg); z-index: 2; animation: floatBoiler 4s ease-in-out infinite; }
        .boiler-top { position: absolute; top: -25px; left: 0; width: 150px; height: 35px; background: linear-gradient(90deg, #333 0%, #888 50%, #333 100%); border-radius: 50% / 100% 100% 0 0; box-shadow: 0 -5px 10px rgba(0,0,0,0.5); }
        .gauge { position: absolute; top: 50px; left: 55px; width: 45px; height: 45px; background: #f1c40f; border-radius: 50%; border: 6px solid #222; box-shadow: inset 0 0 15px rgba(0,0,0,0.6), 0 0 10px rgba(241, 196, 15, 0.5); }
        .gauge::after { content: ''; position: absolute; top: 17px; left: 17px; width: 3px; height: 16px; background: #e74c3c; transform-origin: bottom center; animation: gaugeNeedle 1.5s ease-in-out infinite alternate; box-shadow: 0 0 5px #e74c3c; }
        .pipe { position: absolute; top: 90px; right: -25px; width: 25px; height: 70px; background: linear-gradient(90deg, #555, #888); border-radius: 0 8px 8px 0; box-shadow: 8px 0 15px rgba(0,0,0,0.5); }
        .steam { position: absolute; top: -50px; right: -20px; width: 40px; height: 40px; background: rgba(255, 255, 255, 0.7); border-radius: 50%; filter: blur(10px); animation: steamRise 2.5s ease-out infinite; }
        .engineer { font-size: 115px; position: relative; z-index: 3; margin-left: -40px; filter: drop-shadow(10px 20px 15px rgba(0,0,0,0.8)); animation: floatEngineer 3.5s ease-in-out infinite alternate; transform: rotateY(15deg); }
        
        .menu-container { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); padding: 35px 40px; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 30px 60px rgba(0,0,0,0.6); text-align: center; width: 100%; max-width: 700px; transform: translateZ(40px); }
        h1 { font-size: 23px; font-weight: 900; margin-bottom: 26px; text-transform: uppercase; letter-spacing: 2.5px; text-shadow: 0 4px 10px rgba(0,0,0,0.8); }
        
        .button-group { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 18px 28px; border-radius: 15px; font-family: inherit; font-size: 16px; font-weight: 800; color: white; border: none; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 0 rgba(0,0,0,0.4); text-transform: uppercase; flex: 1 1 250px; }
        .btn:active { transform: translateY(8px); box-shadow: 0 2px 0 rgba(0,0,0,0.4); }
        .btn-exam { background: linear-gradient(135deg, #e74c3c, #c0392b); border-bottom: 4px solid #922b21; }
        .btn-theory { background: linear-gradient(135deg, #3498db, #2980b9); border-bottom: 4px solid #1a5276; }
        .btn-machine-folder { background: linear-gradient(135deg, #f39c12, #d35400); border-bottom: 4px solid #a04000; flex: 1 1 100%; }

        /* ================= 2. FOLDER BÊN MÁY ================= */
        #machineFolderScreen { padding: 15px 14px 125px; max-width: 980px; margin: 0 auto; width: 100%; }
        .folder-header-card { background: rgba(15, 26, 44, 0.92); backdrop-filter: blur(15px); border: 1px solid rgba(241, 196, 15, 0.35); border-radius: 20px; padding: 15px 16px; position: sticky; top: 10px; z-index: 25; margin-bottom: 18px; }
        .folder-top-row { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .btn-back { background: linear-gradient(135deg, #f1c40f, #e67e22); color: #0f1a2c; padding: 10px 16px; border-radius: 10px; font-weight: 900; border: none; cursor: pointer; box-shadow: 0 4px 0 #9c640c; }
        .btn-back:active { transform: translateY(3px); box-shadow: 0 1px 0 #9c640c; }
        .machine-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
        .machine-card { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16); border-radius: 16px; padding: 15px; display: flex; align-items: center; gap: 14px; cursor: pointer; color: #fff; text-align: left; }
        .machine-card:hover { border-color: #f1c40f; background: rgba(255,255,255,0.14); }
        .machine-card-icon { width: 50px; height: 50px; border-radius: 12px; background: rgba(241,196,15,0.2); display: flex; align-items: center; justify-content: center; font-size: 24px; }
        
        /* ================= 3. HỌC TỪNG BÀI (IFRAME) ================= */
        #studyScreen { position: fixed; inset: 0; background: #fff; z-index: 50; }
        .study-topbar { background: #0b1322; padding: 10px; display: flex; justify-content: space-between; align-items: center; }

        /* ================= 4. MÀN HÌNH THI SÁT HẠCH TỔNG HỢP ================= */
        #examScreen { max-width: 900px; margin: 0 auto; width: 100%; padding: 20px 10px 100px; }
        .exam-header { background: linear-gradient(135deg, #b91d47, #7a1228); padding: 15px 20px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 10px; z-index: 30; box-shadow: 0 10px 20px rgba(0,0,0,0.5); border: 2px solid #ff4d6d; }
        .timer-box { font-size: 24px; font-weight: 900; font-family: monospace; background: #000; padding: 5px 15px; border-radius: 8px; color: #00ff00; letter-spacing: 2px; }
        .timer-box.warning { color: #ff0000; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        
        .q-card { background: #fff; color: #1a202c; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .q-sys-badge { display: inline-block; background: #e2e8f0; color: #475569; font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 10px; margin-bottom: 10px; text-transform: uppercase; }
        .q-sys-badge.hard { background: #fee2e2; color: #991b1b; }
        .q-text { font-weight: 700; font-size: 15px; margin-bottom: 15px; }
        .opt-label { display: flex; align-items: flex-start; gap: 10px; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
        .opt-label:hover { border-color: #cbd5e1; background: #f8fafc; }
        .opt-label input { margin-top: 4px; accent-color: #b91d47; width: 16px; height: 16px; }
        .opt-label.selected { border-color: #b91d47; background: #fff0f2; }
        .opt-char { font-weight: 800; color: #b91d47; }
        
        .btn-submit-exam { width: 100%; background: #27ae60; padding: 20px; font-size: 20px; box-shadow: 0 8px 0 #1e8449; margin-top: 20px; }

        /* ================= 5. BÁO CÁO KẾT QUẢ ================= */
        #reportScreen { justify-content: center; align-items: center; padding: 20px; }
        .report-card { background: #fff; color: #1a202c; border-radius: 20px; padding: 40px 30px; text-align: center; max-width: 500px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .badge-result { width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 20px; color: white; font-weight: 900; }
        .badge-pass { background: #27ae60; box-shadow: 0 0 30px rgba(39, 174, 96, 0.5); }
        .badge-fail { background: #e74c3c; box-shadow: 0 0 30px rgba(231, 76, 60, 0.5); }
        .report-score { font-size: 48px; font-weight: 900; color: #0f1a2c; margin-bottom: 10px; }
        .report-stats { display: flex; justify-content: space-around; background: #f8fafc; padding: 15px; border-radius: 12px; margin-bottom: 25px; font-weight: 700; color: #475569; }

        @keyframes floatBoiler { 0%, 100% { transform: rotateY(-20deg) rotateX(5deg) translateY(0); } 50% { transform: rotateY(-20deg) rotateX(5deg) translateY(-10px); } }
        @keyframes floatEngineer { 0% { transform: rotateY(15deg) translateY(0); } 100% { transform: rotateY(15deg) translateY(-18px); } }
        @keyframes gaugeNeedle { 0% { transform: rotate(-40deg); } 100% { transform: rotate(40deg); } }
        @keyframes steamRise { 0% { transform: translateY(0) scale(1); opacity: 0.8; } 100% { transform: translateY(-80px) scale(2.5); opacity: 0; } }
        
        @media (max-width: 768px) {
            .scene-3d { height: 215px; transform: scale(0.82); }
            .button-group { flex-direction: column; }
            .btn { width: 100%; flex: none; }
            .exam-header { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <!-- ================= 1. TRANG CHỦ ================= -->
    <div id="homeScreen" class="screen active">
        <div class="scene-3d">
            <div class="boiler"><div class="boiler-top"></div><div class="gauge"></div><div class="pipe"></div><div class="steam"></div></div>
            <div class="engineer">👷‍♂️</div>
        </div>

        <div class="menu-container">
            <h1>Hệ Thống Đào Tạo NĐMD</h1>
            <div class="button-group">
                <button type="button" onclick="startExamMode()" class="btn btn-exam">🏆 THI SÁT HẠCH TỔNG HỢP</button>
                <button type="button" onclick="alert('Chức năng đang cập nhật!')" class="btn btn-theory">📚 Lý Thuyết An Toàn</button>
                <button type="button" onclick="switchScreen('machineFolderScreen')" class="btn btn-machine-folder">📂 Ôn Luyện Từng Hệ Thống Bên Máy</button>
            </div>
        </div>
    </div>

    <!-- ================= 2. FOLDER BÊN MÁY ================= -->
    <div id="machineFolderScreen" class="screen">
        <div class="folder-header-card">
            <div class="folder-top-row">
                <button onclick="switchScreen('homeScreen')" class="btn-back">⬅ Trang chủ</button>
                <div style="text-align: right; color:#f1c40f; font-weight:900;">16 CHUYÊN ĐỀ TUABIN</div>
            </div>
        </div>
        <div id="machineGridList" class="machine-grid">
            <!-- Render từ JS -->
        </div>
    </div>

    <!-- ================= 3. MÀN HÌNH HỌC TỪNG BÀI ================= -->
    <div id="studyScreen" class="screen">
        <div class="study-topbar">
            <button onclick="switchScreen('machineFolderScreen')" class="btn-back" style="padding: 5px 10px; font-size:12px;">⬅ Quay lại Folder</button>
            <div id="lessonTitle" style="color:#f1c40f; font-weight:800; font-size:14px;"></div>
        </div>
        <iframe id="studyIframe" style="width:100%; flex:1; border:none;"></iframe>
    </div>

    <!-- ================= 4. MÀN HÌNH THI SÁT HẠCH ================= -->
    <div id="examScreen" class="screen">
        <div class="exam-header">
            <div>
                <button onclick="confirmExitExam()" class="btn-back" style="padding: 6px 12px; font-size:12px;">✖ Thoát</button>
                <span style="font-weight:900; margin-left:15px; font-size:18px;">KỲ THI SÁT HẠCH VẬN HÀNH</span>
            </div>
            <div id="examTimer" class="timer-box">45:00</div>
        </div>
        <div id="examForm" style="margin-top:20px;"></div>
        <button onclick="submitExam()" class="btn btn-submit-exam">Xong! Nộp Bài Ngay</button>
    </div>

    <!-- ================= 5. BÁO CÁO KẾT QUẢ THI ================= -->
    <div id="reportScreen" class="screen">
        <div class="report-card">
            <div id="rBadge" class="badge-result badge-pass">ĐẠT</div>
            <div id="rScore" class="report-score">45/50</div>
            <p style="font-weight:700; color:#94a3b8; margin-bottom:20px;">Điểm quy đổi: <span id="rPercent" style="color:#0f1a2c;">90%</span></p>
            <div class="report-stats">
                <div>⏱ Thời gian: <br><span id="rTime" style="color:#e74c3c;">12:34</span></div>
                <div>❌ Sai: <br><span id="rWrong" style="color:#e74c3c;">5 câu</span></div>
            </div>
            <button onclick="switchScreen('homeScreen')" class="btn btn-machine-folder" style="width:100%; padding:15px;">🏠 Về Trang Chủ</button>
        </div>
    </div>

    <script>
        // ================= DỮ LIỆU FOLDER =================
        const machineLessons = [
            { id: 1, file: "Tuabin – Lý thuyết chuyên ngành.html", title: "Lý thuyết Tuabin" },
            { id: 2, file: "tuabin.html", title: "Hệ thống Tuabin - Bảo vệ" },
            { id: 3, file: "boitron.html", title: "Dầu bôi trơn" },
            { id: 4, file: "thuyluc.html", title: "Dầu EH" },
            { id: 5, file: "hơi chèn.html", title: "Hơi chèn" },
            { id: 6, file: "bơmbi.html", title: "Bơm bi bình ngưng" },
            { id: 7, file: "nươcngung.html", title: "Nước ngưng" },
            { id: 8, file: "nướccap.html", title: "Nước cấp" },
            { id: 9, file: "tuanhoan.html", title: "Nước tuần hoàn" },
            { id: 10, file: "lmk.html", title: "Làm mát kín (CCW)" },
            { id: 11, file: "clo.html", title: "Hệ thống Clo" },
            { id: 12, file: "phòng mòn.html", title: "Phòng mòn Tuabin" },
            { id: 13, file: "stator.html", title: "Nước làm mát Stator" },
            { id: 14, file: "dauchen.html", title: "Dầu chèn máy phát" },
            { id: 15, file: "khinen.html", title: "Khí nén" },
            { id: 16, file: "bomquat.html", title: "Sự cố Bơm Quạt" }
        ];

        function initFolder() {
            const grid = document.getElementById('machineGridList');
            machineLessons.forEach(item => {
                grid.innerHTML += `
                    <div class="machine-card" onclick="openLesson('${item.file}', '${item.title}')">
                        <div class="machine-card-icon">⚙️</div>
                        <div>
                            <div style="font-size:14px; font-weight:800;">${item.title}</div>
                            <div style="font-size:11px; color:#94a3b8;">Bài ${item.id}</div>
                        </div>
                    </div>`;
            });
        }
        initFolder();

        // ================= NGÂN HÀNG CÂU HỎI TỔNG HỢP (MẪU) =================
        // Anh Pip copy toàn bộ các biến QUESTIONS từ 16 file vào mảng khổng lồ này.
        // Dưới đây là dữ liệu mẫu trích từ các file trước đó để test thuật toán.
        const MASTER_BANK = [
            { sys: 'Tuabin', diff: 'Hard', q: 'Theo qui định (O&M), số lần tuabin khởi động ấm trong 1 năm là?', opts: ['2 lần','4 lần','8 lần','10 lần'], ans: 4 },
            { sys: 'Tuabin', diff: 'Easy', q: 'Giá trị bảo vệ Trip tuabin do áp lực dầu bôi trơn thấp?', opts: ['1,12 bar','1,21 bar','1,31 bar','1,46 bar'], ans: 2 },
            { sys: 'Dầu EH', diff: 'Medium', q: 'Liên động bơm dầu thủy lực dự phòng vào làm việc khi áp lực đầu đẩy bơm đang làm việc giảm xuống?', opts: ['< 150 bar','< 130 bar','< 145 bar','< 135 bar'], ans: 2 },
            { sys: 'Dầu chèn', diff: 'Hard', q: 'Giá trị cảnh báo chênh áp dầu chèn và hydro thấp:', opts: ['0.35 Bar','0.41 Bar','0.5 Bar','0.55 Bar'], ans: 2 },
            { sys: 'Nước ngưng', diff: 'Easy', q: 'Bảo vệ trip bơm ngưng do nhiệt độ stator động cơ cao là?', opts: ['105°C','130°C','135°C','140°C'], ans: 3 },
            { sys: 'Khí nén', diff: 'Medium', q: 'Giá trị bảo vệ nhiệt độ cuộn dây động cơ máy nén khí:', opts: ['120°C','130°C','140°C','150°C'], ans: 1 },
            { sys: 'Nước cấp', diff: 'Hard', q: 'Giá trị bảo vệ nhiệt độ gối trục bơm tăng áp BFP:', opts: ['> 95°C sau 5s','> 95°C sau 3s','> 105°C sau 3s','> 105°C sau 5s'], ans: 2 },
            { sys: 'CWP', diff: 'Easy', q: 'Giá trị bảo vệ trip bơm tuần hoàn do nhiệt độ gối dưới động cơ cao là?', opts: ['80°C','85°C','90°C','95°C'], ans: 4 },
            { sys: 'Stator', diff: 'Hard', q: 'Giá trị bảo vệ Trip bơm nước làm mát stator do độ dẫn nước cao là?', opts: ['0,5 µS/cm','5,5 µS/cm','0,9 µS/cm','9,9 µS/cm'], ans: 4 },
            { sys: 'Bơm bi', diff: 'Medium', q: 'Quá trình rửa ngược khẩn cấp diễn ra khi chênh áp qua lưới lọc bi vượt quá:', opts: ['50 mbar','55 mbar','60 mbar','65 mbar'], ans: 3 }
        ];

        // ================= LOGIC THI SÁT HẠCH =================
        let examTimerInterval;
        let timeRemaining = 45 * 60; // 45 phút
        let timeUsed = 0;
        let currentExamQuestions = [];

        function shuffleArray(array) {
            let cur = array.length, rnd;
            while (cur != 0) {
                rnd = Math.floor(Math.random() * cur);
                cur--;
                [array[cur], array[rnd]] = [array[rnd], array[cur]];
            }
            return array;
        }

        function startExamMode() {
            switchScreen('examScreen');
            
            // 1. Lấy ngẫu nhiên N câu (Ví dụ 10 câu cho bản demo, thực tế anh để 50)
            let shuffledBank = shuffleArray([...MASTER_BANK]);
            let selectedQ = shuffledBank.slice(0, 10); 

            // 2. Trộn đáp án từng câu và bám vết đáp án đúng
            currentExamQuestions = selectedQ.map(q => {
                // Đóng gói text đáp án và cờ "isCorrect" (q.ans là base 1)
                let mappedOpts = q.opts.map((text, idx) => ({
                    text: text,
                    isCorrect: q.mmc ? q.mmcAns.includes(idx + 1) : (q.ans === idx + 1)
                }));
                
                shuffleArray(mappedOpts); // Trộn A,B,C,D
                
                // Cập nhật lại chỉ số đáp án đúng mới (base 1)
                let newAns = q.mmc 
                    ? mappedOpts.map((o, i) => o.isCorrect ? i+1 : null).filter(x => x)
                    : mappedOpts.findIndex(o => o.isCorrect) + 1;

                return {
                    sys: q.sys, diff: q.diff, q: q.q, mmc: q.mmc,
                    opts: mappedOpts.map(o => o.text),
                    ans: newAns, mmcAns: q.mmc ? newAns : null
                };
            });

            renderExam();
            startTimer();
        }

        function renderExam() {
            const form = document.getElementById('examForm');
            const LETTERS = ['A', 'B', 'C', 'D'];
            let html = '';

            currentExamQuestions.forEach((item, i) => {
                const type = item.mmc ? 'checkbox' : 'radio';
                const badgeClass = item.diff === 'Hard' ? 'hard' : '';
                
                let optsHtml = item.opts.map((optText, j) => `
                    <label class="opt-label" id="el-opt-${i}-${j}">
                        <input type="${type}" name="q${i}" value="${j+1}" onchange="selectOpt(this, ${i})">
                        <span class="opt-char">${LETTERS[j]}.</span>
                        <span>${optText}</span>
                    </label>
                `).join('');

                html += `
                <div class="q-card" id="el-q-${i}">
                    <span class="q-sys-badge ${badgeClass}">${item.sys} | ${item.diff}</span>
                    ${item.mmc ? '<span class="q-sys-badge" style="background:#fef3c7;color:#92400e">Nhiều đáp án</span>' : ''}
                    <div class="q-text">Câu ${i+1}: ${item.q}</div>
                    ${optsHtml}
                </div>`;
            });
            form.innerHTML = html;
        }

        function selectOpt(inputEl, qIdx) {
            // Hiệu ứng bôi màu khi chọn
            const container = document.getElementById(`el-q-${qIdx}`);
            if(inputEl.type === 'radio') {
                container.querySelectorAll('.opt-label').forEach(el => el.classList.remove('selected'));
            }
            inputEl.closest('.opt-label').classList.toggle('selected', inputEl.checked);
        }

        function startTimer() {
            timeRemaining = 45 * 60;
            timeUsed = 0;
            clearInterval(examTimerInterval);
            const timerBox = document.getElementById('examTimer');
            timerBox.classList.remove('warning');

            examTimerInterval = setInterval(() => {
                timeRemaining--;
                timeUsed++;
                
                let m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
                let s = (timeRemaining % 60).toString().padStart(2, '0');
                timerBox.textContent = `${m}:${s}`;

                if(timeRemaining <= 180) timerBox.classList.add('warning'); // Dưới 3 phút nháy đỏ
                
                if (timeRemaining <= 0) {
                    clearInterval(examTimerInterval);
                    submitExam();
                }
            }, 1000);
        }

        function confirmExitExam() {
            if(confirm("Bạn có chắc muốn thoát? Kết quả bài làm sẽ không được lưu.")) {
                clearInterval(examTimerInterval);
                switchScreen('homeScreen');
            }
        }

        function submitExam() {
            clearInterval(examTimerInterval);
            let correctCount = 0;

            currentExamQuestions.forEach((q, i) => {
                let inputs = document.querySelectorAll(`input[name="q${i}"]:checked`);
                let userAns = Array.from(inputs).map(inp => parseInt(inp.value));
                
                if (q.mmc) {
                    let isCorrect = (userAns.length === q.mmcAns.length) && userAns.every(val => q.mmcAns.includes(val));
                    if (isCorrect) correctCount++;
                } else {
                    if (userAns[0] === q.ans) correctCount++;
                }
            });

            const total = currentExamQuestions.length;
            const pct = Math.round((correctCount / total) * 100);
            
            // Format Time Used
            let mU = Math.floor(timeUsed / 60).toString().padStart(2, '0');
            let sU = (timeUsed % 60).toString().padStart(2, '0');

            document.getElementById('rScore').textContent = `${correctCount}/${total}`;
            document.getElementById('rPercent').textContent = `${pct}%`;
            document.getElementById('rTime').textContent = `${mU}:${sU}`;
            document.getElementById('rWrong').textContent = `${total - correctCount} câu`;

            const badge = document.getElementById('rBadge');
            if(pct >= 80) {
                badge.className = 'badge-result badge-pass';
                badge.textContent = 'ĐẠT';
            } else {
                badge.className = 'badge-result badge-fail';
                badge.textContent = 'TRƯỢT';
            }

            switchScreen('reportScreen');
            window.scrollTo(0,0);
        }

        // ================= NAVIGATION =================
        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function openLesson(file, title) {
            switchScreen('studyScreen');
            document.getElementById('lessonTitle').textContent = title;
            document.getElementById('studyIframe').src = encodeURI(file);
        }
    </script>
</body>
</html>
