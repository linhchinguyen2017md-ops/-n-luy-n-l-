<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Ôn Tập Kỹ Thuật An Toàn & Vận Hành</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #1e3c72 0%, #0f1a2c 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            perspective: 1200px;
        }

        /* ================= 1. MÀN HÌNH TRANG CHỦ GỐC ================= */
        #homeScreen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 15px 115px;
        }

        .scene-3d { 
            position: relative; 
            width: 100%; 
            height: 280px; 
            display: flex; 
            justify-content: center; 
            align-items: flex-end; 
            margin-bottom: 12px; 
        }

        .boiler {
            position: relative; 
            width: 150px; 
            height: 200px;
            background: linear-gradient(135deg, #444 0%, #999 50%, #222 100%);
            border-radius: 15px 15px 5px 5px;
            box-shadow: inset -15px 0 20px rgba(0,0,0,0.6), inset 15px 0 20px rgba(255,255,255,0.2), 20px 25px 35px rgba(0,0,0,0.7);
            transform: rotateY(-20deg) rotateX(5deg); 
            z-index: 2; 
            animation: floatBoiler 4s ease-in-out infinite;
        }

        .boiler-top {
            position: absolute; 
            top: -25px; 
            left: 0; 
            width: 150px; 
            height: 35px;
            background: linear-gradient(90deg, #333 0%, #888 50%, #333 100%);
            border-radius: 50% / 100% 100% 0 0; 
            box-shadow: 0 -5px 10px rgba(0,0,0,0.5);
        }

        .gauge {
            position: absolute; 
            top: 50px; 
            left: 55px; 
            width: 45px; 
            height: 45px;
            background: #f1c40f; 
            border-radius: 50%; 
            border: 6px solid #222;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6), 0 0 10px rgba(241, 196, 15, 0.5);
        }

        .gauge::after {
            content: ''; 
            position: absolute; 
            top: 17px; 
            left: 17px; 
            width: 3px; 
            height: 16px;
            background: #e74c3c; 
            transform-origin: bottom center; 
            animation: gaugeNeedle 1.5s ease-in-out infinite alternate;
            box-shadow: 0 0 5px #e74c3c;
        }

        .pipe {
            position: absolute; 
            top: 90px; 
            right: -25px; 
            width: 25px; 
            height: 70px;
            background: linear-gradient(90deg, #555, #888); 
            border-radius: 0 8px 8px 0; 
            box-shadow: 8px 0 15px rgba(0,0,0,0.5);
        }

        .steam {
            position: absolute; 
            top: -50px; 
            right: -20px; 
            width: 40px; 
            height: 40px;
            background: rgba(255, 255, 255, 0.7); 
            border-radius: 50%; 
            filter: blur(10px); 
            animation: steamRise 2.5s ease-out infinite;
        }

        .engineer {
            font-size: 115px; 
            position: relative; 
            z-index: 3; 
            margin-left: -40px;
            filter: drop-shadow(10px 20px 15px rgba(0,0,0,0.8)); 
            animation: floatEngineer 3.5s ease-in-out infinite alternate; 
            transform: rotateY(15deg);
            user-select: none;
        }

        .menu-container {
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            padding: 35px 40px; 
            border-radius: 25px; 
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.2);
            text-align: center; 
            width: 100%;
            max-width: 700px;
            transform: translateZ(40px); 
            animation: fadeIn 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        h1 {
            color: #fff; 
            font-size: 23px; 
            font-weight: 900; 
            margin-bottom: 26px;
            text-transform: uppercase; 
            letter-spacing: 2.5px; 
            text-shadow: 0 4px 10px rgba(0,0,0,0.8), 0 0 20px rgba(255,255,255,0.2);
        }

        .button-group { 
            display: flex; 
            gap: 18px; 
            justify-content: center; 
            flex-wrap: wrap; 
        }

        .btn {
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px; 
            padding: 18px 28px;
            text-decoration: none; 
            border-radius: 15px; 
            font-family: 'Montserrat', sans-serif;
            font-size: 16px; 
            font-weight: 800; 
            color: white;
            border: none; 
            cursor: pointer; 
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 0 rgba(0,0,0,0.4), 0 20px 25px rgba(0,0,0,0.3);
            position: relative; 
            top: 0; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            flex: 1 1 250px;
        }

        .btn:active { 
            top: 8px; 
            box-shadow: 0 2px 0 rgba(0,0,0,0.4), 0 5px 15px rgba(0,0,0,0.3); 
        }

        .btn:hover { 
            filter: brightness(1.15); 
            transform: scale(1.03); 
        }

        .btn-exam { background: linear-gradient(135deg, #2ecc71, #27ae60); border-bottom: 4px solid #1e8449; }
        .btn-theory { background: linear-gradient(135deg, #3498db, #2980b9); border-bottom: 4px solid #1a5276; }
        
        /* Nút Folder riêng bên Máy (Trắc nghiệm Tuabin) */
        .btn-machine-folder { 
            background: linear-gradient(135deg, #f39c12, #d35400); 
            border-bottom: 4px solid #a04000; 
            flex: 1 1 100%;
            font-size: 17px;
        }

        .folder-count-badge {
            background: rgba(0, 0, 0, 0.35);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* ================= 2. MÀN HÌNH FOLDER RIÊNG BÊN MÁY (TRẮC NGHIỆM TUABIN) ================= */
        #machineFolderScreen {
            display: none;
            min-height: 100vh;
            padding: 15px 14px 125px;
            max-width: 980px;
            margin: 0 auto;
            animation: fadeIn 0.35s ease;
        }

        .folder-header-card {
            background: rgba(15, 26, 44, 0.92);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(241, 196, 15, 0.35);
            border-radius: 20px;
            padding: 15px 16px;
            position: sticky;
            top: 10px;
            z-index: 25;
            box-shadow: 0 15px 35px rgba(0,0,0,0.55);
            margin-bottom: 18px;
        }

        .folder-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .btn-back-main {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #f1c40f, #e67e22);
            color: #0f1a2c;
            border: none;
            padding: 11px 16px;
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 0 #9c640c;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .btn-back-main:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #9c640c;
        }

        .folder-heading {
            text-align: right;
            min-width: 0;
        }

        .folder-heading h2 {
            font-size: 16px;
            font-weight: 900;
            color: #f1c40f;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .folder-heading span {
            font-size: 11px;
            color: #cbd5e1;
            font-weight: 600;
        }

        /* Thanh tìm kiếm & Bộ lọc nhanh bên Máy */
        .search-input-wrap {
            margin-bottom: 10px;
        }

        .search-input-wrap input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 13.5px;
            font-weight: 600;
            outline: none;
        }

        .search-input-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.55);
        }

        .search-input-wrap input:focus {
            border-color: #f1c40f;
            background: rgba(255, 255, 255, 0.14);
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .filter-tabs::-webkit-scrollbar { display: none; }

        .tab-chip {
            flex-shrink: 0;
            padding: 7px 13px;
            border-radius: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 11.5px;
            font-weight: 800;
            background: rgba(255, 255, 255, 0.09);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-chip.active {
            background: #f1c40f;
            color: #0f1a2c;
            border-color: #f1c40f;
        }

        /* Danh sách từng bài học trong Folder bên Máy */
        .machine-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }

        .machine-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 16px;
            padding: 15px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            color: #fff;
            width: 100%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .machine-card:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: #f1c40f;
            transform: translateY(-2px);
        }

        .machine-card:active {
            transform: scale(0.97);
        }

        .machine-card-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(241, 196, 15, 0.22), rgba(230, 126, 34, 0.22));
            border: 1px solid rgba(241, 196, 15, 0.45);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .machine-card-num {
            font-size: 9px;
            font-weight: 800;
            color: #f1c40f;
            margin-top: 2px;
        }

        .machine-card-body {
            flex: 1;
            min-width: 0;
        }

        .machine-group-badge {
            display: inline-block;
            font-size: 9.5px;
            font-weight: 800;
            color: #f1c40f;
            background: rgba(0, 0, 0, 0.38);
            padding: 2px 8px;
            border-radius: 6px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .machine-card-title {
            font-size: 14px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 3px;
            line-height: 1.3;
        }

        .machine-card-file {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .machine-card-go {
            font-size: 16px;
            color: #f1c40f;
            font-weight: 900;
            flex-shrink: 0;
        }

        /* ================= 3. MÀN HÌNH LÀM BÀI (CÓ NÚT QUAY LẠI TRANG CHỦ) ================= */
        #studyScreen {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 60;
            background: #0f1a2c;
            flex-direction: column;
        }

        .study-topbar {
            background: #0b1322;
            border-bottom: 2px solid rgba(241, 196, 15, 0.45);
            padding: 9px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-shrink: 0;
        }

        .study-nav-btns {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-top-action {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 9px 12px;
            border-radius: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 11.5px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            color: #fff;
        }

        .btn-top-action:active {
            transform: scale(0.95);
        }

        .btn-go-home {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            box-shadow: 0 3px 0 #1e8449;
        }

        .btn-go-folder {
            background: linear-gradient(135deg, #f39c12, #d35400);
            box-shadow: 0 3px 0 #a04000;
        }

        .study-lesson-title {
            flex: 1;
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            color: #f1c40f;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 4px;
        }

        .btn-refresh-lesson {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .study-frame-container {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #fff;
            position: relative;
        }

        #studyIframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ================= 4. ANH KỸ SƯ ĐỨNG CẠNH CỔ VŨ (MOBILE-FRIENDLY) ================= */
        .engineer-companion {
            position: fixed;
            bottom: 12px;
            right: 12px;
            z-index: 95;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            pointer-events: none;
        }

        .engineer-bubble {
            pointer-events: auto;
            background: rgba(15, 26, 44, 0.96);
            border: 2px solid #f1c40f;
            border-radius: 18px 18px 4px 18px;
            padding: 11px 14px;
            max-width: 245px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.7);
            position: relative;
            animation: fadeIn 0.25s ease;
        }

        .bubble-close-btn {
            position: absolute;
            top: -9px;
            left: -9px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #e74c3c;
            color: #fff;
            border: 2px solid #0f1a2c;
            font-size: 11px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bubble-title {
            font-size: 10px;
            font-weight: 900;
            color: #f1c40f;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .bubble-text {
            font-size: 11.5px;
            line-height: 1.4;
            color: #f8fafc;
            font-weight: 600;
        }

        .engineer-btn {
            pointer-events: auto;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #2980b9, #0f1a2c);
            border: 3px solid #f1c40f;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6), 0 0 12px rgba(241, 196, 15, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            cursor: pointer;
            animation: floatAvatar 3s ease-in-out infinite alternate;
            position: relative;
            user-select: none;
            flex-shrink: 0;
        }

        .engineer-btn:active {
            transform: scale(0.9);
        }

        .engineer-tag {
            position: absolute;
            bottom: -4px;
            background: #2ecc71;
            color: #0f1a2c;
            font-size: 9px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 10px;
            text-transform: uppercase;
            border: 1px solid #0f1a2c;
        }

        @keyframes floatBoiler { 
            0%, 100% { transform: rotateY(-20deg) rotateX(5deg) translateY(0); } 
            50% { transform: rotateY(-20deg) rotateX(5deg) translateY(-10px); } 
        }
        @keyframes floatEngineer { 
            0% { transform: rotateY(15deg) translateY(0); } 
            100% { transform: rotateY(15deg) translateY(-18px); } 
        }
        @keyframes floatAvatar {
            0% { transform: translateY(0); }
            100% { transform: translateY(-6px); }
        }
        @keyframes gaugeNeedle { 
            0% { transform: rotate(-40deg); } 
            100% { transform: rotate(40deg); } 
        }
        @keyframes steamRise { 
            0% { transform: translateY(0) scale(1); opacity: 0.8; } 
            100% { transform: translateY(-80px) scale(2.5); opacity: 0; } 
        }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(18px) scale(0.95); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }

        /* ================= TỐI ƯU HIỂN THỊ TRÊN ĐIỆN THOẠI ================= */
        @media (max-width: 768px) {
            .scene-3d { height: 215px; transform: scale(0.82); margin-bottom: 4px; }
            .menu-container { padding: 25px 18px; width: 95%; border-radius: 20px; }
            h1 { font-size: 17px; margin-bottom: 18px; letter-spacing: 1.5px; }
            .button-group { flex-direction: column; gap: 14px; }
            .btn { padding: 15px 18px; font-size: 14.5px; width: 100%; flex: none; }
            .machine-grid { grid-template-columns: 1fr; }
            .folder-heading h2 { font-size: 14px; }
            .study-lesson-title { font-size: 11.5px; }
            .btn-top-action { padding: 8px 10px; font-size: 10.5px; }
            .engineer-bubble { max-width: 205px; padding: 9px 12px; }
            .engineer-btn { width: 56px; height: 56px; font-size: 32px; }
        }
    </style>
</head>
<body>

    <!-- ================= 1. TRANG CHỦ GỐC ================= -->
    <div id="homeScreen">
        <div class="scene-3d">
            <div class="boiler">
                <div class="boiler-top"></div>
                <div class="gauge"></div>
                <div class="pipe"></div>
                <div class="steam"></div>
                <div class="steam" style="animation-delay: 1.2s; right: -10px;"></div>
            </div>
            <div class="engineer">👷‍♂️</div>
        </div>

        <div class="menu-container">
            <h1>Hệ Thống Ôn Tập An Toàn & Vận Hành</h1>
            <div class="button-group">
                <!-- 2 Danh mục gốc của bạn -->
                <button type="button" onclick="startLesson('tracnghiemlo.html', 'Thi Trắc Nghiệm An Toàn - Lò', 'home')" class="btn btn-exam">
                    📝 Thi Trắc Nghiệm
                </button>
                <button type="button" onclick="startLesson('lythuyet.html', 'Lý Thuyết An Toàn', 'home')" class="btn btn-theory">
                    📚 Lý Thuyết An Toàn
                </button>

                <!-- Folder riêng bên Máy (Trắc nghiệm Tuabin) gồm 16 bài -->
                <button type="button" onclick="openMachineFolder()" class="btn btn-machine-folder">
                    📂 Trắc Nghiệm Bên Máy (Tuabin) <span class="folder-count-badge">16 Bài</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ================= 2. FOLDER RIÊNG BÊN MÁY (TRẮC NGHIỆM TUABIN) ================= -->
    <div id="machineFolderScreen">
        <div class="folder-header-card">
            <div class="folder-top-row">
                <button type="button" onclick="goHome()" class="btn-back-main">
                    ⬅ Trang chủ
                </button>
                <div class="folder-heading">
                    <h2>📂 Folder Bên Máy: Trắc Nghiệm Tuabin</h2>
                    <span>16 chuyên đề vận hành Tuabin & Phụ trợ</span>
                </div>
            </div>

            <div class="search-input-wrap">
                <input type="text" id="machineSearch" placeholder="🔍 Tìm nhanh bài bên Máy (VD: hơi chèn, nước cấp, stator, dầu...)" oninput="renderMachineList()">
            </div>

            <div class="filter-tabs" id="machineTabs">
                <button type="button" class="tab-chip active" onclick="filterMachineGroup('all', this)">Tất cả (16)</button>
                <button type="button" class="tab-chip" onclick="filterMachineGroup('Tuabin & Dầu', this)">⚙️ Tuabin & Dầu</button>
                <button type="button" class="tab-chip" onclick="filterMachineGroup('Chu trình Nước', this)">💧 Nước & Tuần hoàn</button>
                <button type="button" class="tab-chip" onclick="filterMachineGroup('Máy phát & Phụ trợ', this)">⚡ Máy phát & Phụ trợ</button>
            </div>
        </div>

        <div id="machineGridList" class="machine-grid"></div>
    </div>

    <!-- ================= 3. MÀN HÌNH HỌC & LÀM BÀI (CÓ NÚT QUAY LẠI TRANG CHỦ) ================= -->
    <div id="studyScreen">
        <div class="study-topbar">
            <div class="study-nav-btns">
                <button type="button" onclick="goHome()" class="btn-top-action btn-go-home">
                    🏠 Trang chủ
                </button>
                <button type="button" id="btnReturnFolder" onclick="openMachineFolder()" class="btn-top-action btn-go-folder">
                    📂 Folder Máy
                </button>
            </div>

            <div id="activeLessonName" class="study-lesson-title">Đang tải bài học...</div>

            <button type="button" onclick="reloadActiveLesson()" class="btn-refresh-lesson" title="Làm lại bài này">
                🔄
            </button>
        </div>

        <div class="study-frame-container">
            <iframe id="studyIframe" src="about:blank"></iframe>
        </div>
    </div>

    <!-- ================= 4. ANH KỸ SƯ ĐỨNG CẠNH CỔ VŨ KHI LÀM BÀI ================= -->
    <div class="engineer-companion">
        <div id="engineerBubble" class="engineer-bubble">
            <button type="button" class="bubble-close-btn" onclick="closeBubble(event)" title="Thu gọn lời thoại">✕</button>
            <div class="bubble-title">👷‍♂️ Kỹ sư Vận hành cổ vũ</div>
            <div id="engineerSpeech" class="bubble-text">
                Chào đồng nghiệp! Chọn <b>Folder Trắc Nghiệm Bên Máy</b> để ôn luyện trọn bộ 16 chuyên đề Tuabin nhé! 💪
            </div>
        </div>

        <div class="engineer-btn" onclick="nextCheerSpeech()" title="Chạm vào Kỹ sư để đổi lời cổ vũ">
            👷‍♂️
            <span class="engineer-tag">Cố lên!</span>
        </div>
    </div>

    <script>
        // Danh sách đầy đủ 16 file thuộc Folder riêng Bên Máy (Trắc nghiệm Tuabin) bạn đã cung cấp
        const machineLessons = [
            { id: 1, file: "Tuabin – Lý thuyết chuyên ngành.html", title: "Tuabin – Lý thuyết chuyên ngành", group: "Tuabin & Dầu", icon: "📘" },
            { id: 2, file: "tuabin.html", title: "Trắc nghiệm Hệ thống Tuabin", group: "Tuabin & Dầu", icon: "⚙️" },
            { id: 3, file: "boitron.html", title: "Hệ thống Dầu bôi trơn", group: "Tuabin & Dầu", icon: "🛢️" },
            { id: 4, file: "thuyluc.html", title: "Hệ thống Dầu thủy lực (EH)", group: "Tuabin & Dầu", icon: "🎛️" },
            { id: 5, file: "hơi chèn.html", title: "Hệ thống Hơi chèn Tuabin", group: "Tuabin & Dầu", icon: "☁️" },
            { id: 6, file: "bơmbi.html", title: "Hệ thống Bơm bi bình ngưng", group: "Tuabin & Dầu", icon: "🔵" },
            { id: 7, file: "nươcngung.html", title: "Hệ thống Nước ngưng", group: "Chu trình Nước", icon: "💧" },
            { id: 8, file: "nướccap.html", title: "Hệ thống Nước cấp", group: "Chu trình Nước", icon: "🌊" },
            { id: 9, file: "tuanhoan.html", title: "Hệ thống Nước tuần hoàn", group: "Chu trình Nước", icon: "🔄" },
            { id: 10, file: "lmk.html", title: "Hệ thống Nước làm mát kín (LMK)", group: "Chu trình Nước", icon: "❄️" },
            { id: 11, file: "clo.html", title: "Hệ thống Châm Clo", group: "Chu trình Nước", icon: "🧪" },
            { id: 12, file: "phòng mòn.html", title: "Hệ thống Phòng mòn", group: "Chu trình Nước", icon: "🛡️" },
            { id: 13, file: "stator.html", title: "Nước làm mát Stator máy phát", group: "Máy phát & Phụ trợ", icon: "⚡" },
            { id: 14, file: "dauchen.html", title: "Hệ thống Dầu chèn máy phát", group: "Máy phát & Phụ trợ", icon: "🔒" },
            { id: 15, file: "khinen.html", title: "Hệ thống Khí nén", group: "Máy phát & Phụ trợ", icon: "🌬️" },
            { id: 16, file: "bomquat.html", title: "Hệ thống Bơm & Quạt", group: "Máy phát & Phụ trợ", icon: "🌀" }
        ];

        // Lời cổ vũ từ Anh Kỹ Sư khi làm bài
        const engineerCheers = [
            "Bình tĩnh đọc kỹ đề nhé! Nắm chắc thông số liên động bảo vệ Tuabin là ăn điểm tuyệt đối! 💪",
            "Chú ý các ngưỡng áp suất dầu bôi trơn, dầu EH và độ chân không bình ngưng nhé! ⚡",
            "Mỗi câu trắc nghiệm làm đúng hôm nay là thêm vững tay nghề trên giao diện vận hành! 🛠️",
            "Làm bài mỏi mắt thì nhấp ngụm cà phê đen nguyên chất cho tỉnh táo rồi chiến tiếp nhé! ☕",
            "Nhớ phân biệt rõ điều kiện khởi động bơm dự phòng (Auto Start) và điều kiện ngừng (Stop) nhé! 🎯",
            "Cố lên! Ôn hết 16 bài trong Folder Bên Máy là tự tin nắm chắc toàn bộ chu trình Tuabin! 🏆",
            "Khi muốn chuyển sang bài khác, bấm nút Folder Máy hoặc Trang chủ ở góc trên cùng bên trái nhé! 👍"
        ];

        let currentGroup = 'all';
        let cheerIdx = 0;

        const homeScreen = document.getElementById('homeScreen');
        const machineFolderScreen = document.getElementById('machineFolderScreen');
        const studyScreen = document.getElementById('studyScreen');
        const machineGridList = document.getElementById('machineGridList');
        const machineSearch = document.getElementById('machineSearch');
        const studyIframe = document.getElementById('studyIframe');
        const activeLessonName = document.getElementById('activeLessonName');
        const btnReturnFolder = document.getElementById('btnReturnFolder');
        const engineerBubble = document.getElementById('engineerBubble');
        const engineerSpeech = document.getElementById('engineerSpeech');

        // Khử dấu tiếng Việt hỗ trợ tìm kiếm nhanh trên điện thoại
        function removeVietnameseTones(str) {
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
        }

        // Lọc theo nhóm hệ thống bên Máy
        function filterMachineGroup(groupName, btnEl) {
            currentGroup = groupName;
            document.querySelectorAll('.tab-chip').forEach(btn => btn.classList.remove('active'));
            btnEl.classList.add('active');
            renderMachineList();
        }

        // Hiển thị danh sách 16 bài học trong Folder Bên Máy
        function renderMachineList() {
            const query = removeVietnameseTones(machineSearch.value.trim());
            machineGridList.innerHTML = '';

            const filtered = machineLessons.filter(item => {
                const matchGroup = (currentGroup === 'all') || (item.group === currentGroup);
                const textSearch = removeVietnameseTones(`${item.title} ${item.file} ${item.group}`);
                return matchGroup && textSearch.includes(query);
            });

            if (filtered.length === 0) {
                machineGridList.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 35px; color:#cbd5e1; font-weight:700;">Không tìm thấy bài học phù hợp. Hãy thử từ khóa khác!</div>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('button');
                card.type = 'button';
                card.className = 'machine-card';
                card.onclick = () => startLesson(item.file, `Bài ${item.id}: ${item.title}`, 'machineFolder');
                card.innerHTML = `
                    <div class="machine-card-icon">
                        <span>${item.icon}</span>
                        <span class="machine-card-num">BÀI ${item.id}</span>
                    </div>
                    <div class="machine-card-body">
                        <span class="machine-group-badge">${item.group}</span>
                        <div class="machine-card-title">${item.title}</div>
                        <div class="machine-card-file">📄 ${item.file}</div>
                    </div>
                    <div class="machine-card-go">❯</div>
                `;
                machineGridList.appendChild(card);
            });
        }

        // Mở Folder riêng bên Máy
        function openMachineFolder() {
            homeScreen.style.display = 'none';
            studyScreen.style.display = 'none';
            machineFolderScreen.style.display = 'block';
            studyIframe.src = 'about:blank';
            window.scrollTo(0, 0);

            updateEngineerSpeech("Bạn đang ở <b>Folder Trắc Nghiệm Bên Máy</b>! Chọn 1 trong 16 hệ thống Tuabin để bắt đầu làm bài nhé! 📂");
            history.pushState({ view: 'machineFolder' }, '', '#folder-ben-may');
        }

        // Bắt đầu làm 1 bài học cụ thể
        function startLesson(fileName, lessonTitle, fromSource) {
            homeScreen.style.display = 'none';
            machineFolderScreen.style.display = 'none';
            studyScreen.style.display = 'flex';

            // Nếu mở từ Folder bên Máy thì hiện thêm nút "📂 Folder Máy" cạnh nút "🏠 Trang chủ"
            btnReturnFolder.style.display = (fromSource === 'machineFolder') ? 'inline-flex' : 'none';

            activeLessonName.textContent = lessonTitle;
            studyIframe.src = encodeURI(fileName);

            updateEngineerSpeech(`Đang ôn luyện: <b>${lessonTitle}</b>. Đọc kỹ từng câu hỏi nhé, tôi đứng ngay đây cổ vũ bạn! 🔥`);
            history.pushState({ view: 'study', source: fromSource }, '', `#bai-${encodeURIComponent(fileName)}`);
        }

        // Quay lại Trang chủ chính
        function goHome() {
            machineFolderScreen.style.display = 'none';
            studyScreen.style.display = 'none';
            homeScreen.style.display = 'flex';
            studyIframe.src = 'about:blank';
            window.scrollTo(0, 0);

            updateEngineerSpeech("Đã quay lại <b>Trang chủ</b>! Bạn có thể chọn ôn An toàn - Lò hoặc mở Folder Bên Máy nhé! 👷‍♂️👍");
        }

        // Làm mới đề bài đang mở
        function reloadActiveLesson() {
            if (studyIframe.src && studyIframe.src !== 'about:blank') {
                studyIframe.contentWindow.location.reload();
                updateEngineerSpeech("Đã làm mới lại bài thi! Chúc bạn đạt điểm tuyệt đối 100% ở lượt làm này nhé! 💯");
            }
        }

        // Tương tác với Anh Kỹ sư cổ vũ
        function updateEngineerSpeech(htmlContent) {
            engineerBubble.style.display = 'block';
            engineerSpeech.innerHTML = htmlContent;
        }

        function closeBubble(e) {
            e.stopPropagation();
            engineerBubble.style.display = 'none';
        }

        function nextCheerSpeech() {
            engineerBubble.style.display = 'block';
            cheerIdx = (cheerIdx + 1) % engineerCheers.length;
            engineerSpeech.innerHTML = engineerCheers[cheerIdx];
        }

        // Tự động đổi lời cổ vũ mỗi 25 giây khi đang mở bài học
        setInterval(() => {
            if (studyScreen.style.display === 'flex' && engineerBubble.style.display !== 'none') {
                nextCheerSpeech();
            }
        }, 25000);

        // Hỗ trợ nút Back vật lý trên điện thoại quay về đúng màn hình trước đó
        window.addEventListener('popstate', () => {
            if (studyScreen.style.display === 'flex') {
                if (btnReturnFolder.style.display !== 'none') {
                    openMachineFolder();
                } else {
                    goHome();
                }
            } else if (machineFolderScreen.style.display === 'block') {
                goHome();
            }
        });

        // Khởi tạo danh sách 16 bài học bên Máy
        renderMachineList();
    </script>
</body>
</html>
